// ═══════════════════════════════════════════════════════════════
// KI-CLIENT: Anthropic oder OpenAI-kompatibler (lokaler) Server
// ═══════════════════════════════════════════════════════════════
// parts: [{type:"text",text}, {type:"image",mime,data}, {type:"pdf",data}] (data = base64)

const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174";
let pdfjsPromise = null;
const loadPdfJs = () => {
  if(!pdfjsPromise) pdfjsPromise = new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = `${PDFJS_BASE}/pdf.min.js`;
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/pdf.worker.min.js`;
                       resolve(window.pdfjsLib); };
    s.onerror = () => { pdfjsPromise = null; reject(new Error("pdf.js konnte nicht geladen werden")); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
};

// Lokale Modelle verstehen keine PDFs: Text extrahieren, bei Scans Seiten als Bild rendern
const pdfToParts = async (b64, mode) => {
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({ data: Uint8Array.from(atob(b64), c=>c.charCodeAt(0)) }).promise;
  if(mode!=="image"){
    let text = "";
    for(let i=1; i<=Math.min(doc.numPages,10); i++){
      const tc = await (await doc.getPage(i)).getTextContent();
      text += tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("") + "\n\n";
    }
    if(text.replace(/\s/g,"").length >= 30)
      return [{ type:"text", text:`Inhalt des PDF-Belegs (extrahierter Text):\n${text.trim()}` }];
  }
  const parts = [];
  for(let i=1; i<=Math.min(doc.numPages,3); i++){
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale:2 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext:canvas.getContext("2d"), viewport:vp }).promise;
    parts.push({ type:"image", mime:"image/png", data:canvas.toDataURL("image/png").split(",")[1] });
  }
  return parts;
};

const apiErrorText = (data, status) => {
  const e = data?.error;
  return (typeof e==="string" ? e : e?.message) || `HTTP ${status}`;
};

const callLLM = async ({ system, parts, maxTokens, schema }) => {
  const C = LLM_CONFIG;
  const max_tokens = Math.round(maxTokens * C.maxTokensFactor);
  const TRUNC = "Antwort abgeschnitten (max_tokens erreicht) – in config.js csvBatchSize verkleinern oder maxTokensFactor erhöhen.";
  let res;

  if(C.provider==="anthropic"){
    if(!C.apiKey) throw new Error("Kein API-Key – bitte config.js anlegen (siehe config.example.js).");
    const content = parts.map(p =>
      p.type==="text" ? { type:"text", text:p.text }
      : p.type==="pdf" ? { type:"document", source:{ type:"base64", media_type:"application/pdf", data:p.data } }
      : { type:"image", source:{ type:"base64", media_type:p.mime, data:p.data } });
    res = await fetch(`${C.baseUrl}/messages`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":C.apiKey, "anthropic-version":"2023-06-01",
                "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:C.model, max_tokens, system, messages:[{ role:"user", content }] }),
    });
    const data = await res.json().catch(()=>null);
    if(!res.ok || data?.error) throw new Error(apiErrorText(data, res.status));
    if(data.stop_reason==="max_tokens") throw new Error(TRUNC);
    return (data.content||[]).map(b=>b.text||"").join("");
  }

  // OpenAI-kompatibel (Ollama, LM Studio, llama.cpp, vLLM …)
  const expanded = [];
  for(const p of parts) expanded.push(...(p.type==="pdf" ? await pdfToParts(p.data, C.pdfMode) : [p]));
  const content = expanded.map(p => p.type==="text"
    ? { type:"text", text:p.text }
    : { type:"image_url", image_url:{ url:`data:${p.mime};base64,${p.data}` } });
  const onlyText = content.every(c=>c.type==="text");
  const body = {
    model:C.model, max_tokens, temperature:0,
    messages:[ { role:"system", content:system },
               { role:"user", content: onlyText ? content.map(c=>c.text).join("\n\n") : content } ],
  };
  if(schema && C.jsonSchema) body.response_format = { type:"json_schema", json_schema:{ name:"antwort", strict:true, schema } };
  else if(C.jsonMode) body.response_format = { type:"json_object" };
  try {
    res = await fetch(`${C.baseUrl}/chat/completions`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", ...(C.apiKey ? { Authorization:`Bearer ${C.apiKey}` } : {}) },
      body: JSON.stringify(body),
    });
  } catch {
    throw new Error(`Modell-Server unter ${C.baseUrl} nicht erreichbar – läuft er, und erlaubt er CORS `+
                    `(Ollama: OLLAMA_ORIGINS="*", LM Studio: «Enable CORS»)?`);
  }
  const data = await res.json().catch(()=>null);
  if(!res.ok || data?.error) throw new Error(apiErrorText(data, res.status));
  const choice = data?.choices?.[0];
  if(choice?.finish_reason==="length") throw new Error(TRUNC);
  return choice?.message?.content || "";
};

// JSON aus der Modellantwort holen (toleriert <think>-Blöcke, Code-Fences und Begleittext)
const parseLLMJson = (raw) => {
  const s = String(raw||"").replace(/<think>[\s\S]*?<\/think>/gi,"")
              .replace(/^\s*```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  if(!s) throw new Error("Keine Antwort vom Modell erhalten");
  try { return JSON.parse(s); } catch {}
  const starts = [s.indexOf("{"), s.indexOf("[")].filter(i=>i>=0);
  const end = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
  if(starts.length && end>Math.min(...starts)) {
    try { return JSON.parse(s.slice(Math.min(...starts), end+1)); } catch {}
  }
  throw new Error("Antwort des Modells ist kein gültiges JSON");
};

// Kontonummern prüfen – kleine Modelle erfinden gerne Konten
const checkSuggestionAccounts = (s, accounts) => {
  for(const k of ["debit","credit"])
    if(!accounts.some(a=>a.number===s[k]))
      return `${k==="debit"?"Soll":"Haben"}-Konto «${s[k]||"—"}» existiert nicht im Kontenplan.`;
  return null;
};

// ═══════════════════════════════════════════════════════════════
// KONTOAUSZUG-IMPORT: camt.053 / .052 / .054 (ISO 20022) und CSV
// ═══════════════════════════════════════════════════════════════
// Alle Parser liefern dieselbe Struktur. Datum und Betrag stammen IMMER aus der Datei –
// die KI wählt später nur das Gegenkonto und einen Buchungstext.
//   Transaktion: { key, date:"YYYY-MM-DD", amount:±Zahl in Kontowährung, currency,
//                  counterparty, iban, text, reference, bankRef, origAmount, origCurrency }
//   Auszug:      { format, iban, currency, txs, info:[…] }

const toIsoDate = (s) => {
  const v = String(s||"").trim();
  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = v.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4}|\d{2})\b/);
  if(m) return `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
};

// Beträge aus Bank-CSVs: 1'234.50 · 1.234,50 · -12,30 · 12.30- · (12.30) · CHF 12.30
const parseAmount = (v) => {
  let s = String(v??"").replace(/[\s'’ ]/g,"").replace(/^[A-Za-z]{3}/,"").replace(/[A-Za-z]{3}$/,"");
  if(!s) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  if(/-$/.test(s)){ neg = true; s = s.slice(0,-1); }
  s = s.replace(/^\+/,"");
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if(lc>=0 && ld>=0) s = lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if(lc>=0) s = (s.match(/,/g).length>1) ? s.replace(/,/g,"") : s.replace(",",".");
  if(!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  const n = parseFloat(s);
  return neg ? -Math.abs(n) : n;
};

// Eindeutige Schlüssel für die Duplikaterkennung (gleiche Datei zweimal importiert)
const withImportKeys = (txs, prefix) => {
  const seen = {};
  return txs.map(t=>{
    const base = `${prefix}|${t.date}|${t.amount.toFixed(2)}|${t.bankRef || (t.counterparty+"|"+t.text).slice(0,80)}`;
    const n = seen[base] = (seen[base]||0)+1;
    return { ...t, key: n>1 ? `${base}#${n}` : base };
  });
};

// ── camt (XML) ──────────────────────────────────────────────────
// Namespace-unabhängig (camt.053.001.02 … .08): Elemente nur über localName suchen
const xKids = (el, name) => el ? [...el.children].filter(c=>c.localName===name) : [];
const xKid  = (el, ...path) => path.reduce((e,n)=>e ? [...e.children].find(c=>c.localName===n)||null : null, el||null);
const xTxt  = (el, ...path) => (xKid(el,...path)?.textContent||"").replace(/\s+/g," ").trim();

const parseCamt = (xml) => {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("XML-Datei ist nicht lesbar.");
  const msg  = [...doc.documentElement.children][0];
  const kind = { BkToCstmrStmt:["Stmt","camt.053"], BkToCstmrAcctRpt:["Rpt","camt.052"],
                 BkToCstmrDbtCdtNtfctn:["Ntfctn","camt.054"] }[msg?.localName];
  if(!kind) throw new Error("Keine camt.052/053/054-Datei (ISO 20022) erkannt.");
  const stmts = xKids(msg, kind[0]);
  const ibans = [...new Set(stmts.map(s=>xTxt(s,"Acct","Id","IBAN")||xTxt(s,"Acct","Id","Othr","Id")))];
  if(ibans.length>1)
    throw new Error(`Datei enthält ${ibans.length} Konten (${ibans.join(", ")}) – bitte pro Konto einzeln exportieren.`);
  const iban = ibans[0]||"";
  const dir  = (el, fallback) => { const c = xTxt(el,"CdtDbtInd"); return c==="DBIT" ? -1 : c==="CRDT" ? 1 : fallback; };
  const txs = [];
  let split = 0, skipped = 0;

  for(const st of stmts){
    const acctCcy = xTxt(st,"Acct","Ccy");
    for(const n of xKids(st,"Ntry")){
      const sts = xTxt(n,"Sts");
      if(sts && sts!=="BOOK"){ skipped++; continue; }           // vorgemerkte/Info-Buchungen
      const amtEl = xKid(n,"Amt");
      const currency = amtEl?.getAttribute("Ccy") || acctCcy || CHF;
      const sign = dir(n, 1);
      const amt  = parseFloat(amtEl?.textContent);
      if(isNaN(amt)) continue;
      const date = toIsoDate(xTxt(n,"BookgDt","Dt") || xTxt(n,"BookgDt","DtTm") || xTxt(n,"ValDt","Dt"));
      const nRef = xTxt(n,"AcctSvcrRef") || xTxt(n,"NtryRef");
      const addl = xTxt(n,"AddtlNtryInf");
      const tds  = xKids(n,"NtryDtls").flatMap(d=>xKids(d,"TxDtls"));
      const tdAmt = td => parseFloat(xKid(td,"Amt")?.textContent ?? xKid(td,"AmtDtls","TxAmt","Amt")?.textContent);
      // Sammelbuchung aufteilen, wenn die Einzelbeträge vollständig sind und aufgehen
      const canSplit = tds.length>1 && tds.every(td=>!isNaN(tdAmt(td))) &&
        Math.abs(tds.reduce((s,td)=>s+dir(td,sign)*tdAmt(td),0) - sign*amt) < 0.005;
      if(canSplit) split++;
      const parts = canSplit ? tds : [tds.length===1 ? tds[0] : null];

      parts.forEach((td,i)=>{
        const s  = canSplit ? dir(td,sign) : sign;
        const a  = canSplit ? tdAmt(td) : amt;
        const p  = s>0 ? "Dbtr" : "Cdtr";                     // Eingang: Zahler · Ausgang: Empfänger
        const rp = xKid(td,"RltdPties");
        const counterparty = xTxt(rp,p,"Nm") || xTxt(rp,p,"Pty","Nm") ||
                             xTxt(rp,"Ultmt"+p,"Nm") || xTxt(rp,"Ultmt"+p,"Pty","Nm");
        const rmt   = xKid(td,"RmtInf");
        const ustrd = xKids(rmt,"Ustrd").map(e=>e.textContent.trim()).join(" ");
        const e2e   = xTxt(td,"Refs","EndToEndId");
        const instd = xKid(td,"AmtDtls","InstdAmt","Amt");
        const instdCcy = instd?.getAttribute("Ccy");
        const tRef  = xTxt(td,"Refs","AcctSvcrRef");
        txs.push({
          date, amount: s*Math.abs(a), currency, counterparty,
          iban: xTxt(rp,p+"Acct","Id","IBAN"),
          text: [...new Set([ustrd, xTxt(td,"AddtlTxInf"), canSplit && i>0 ? "" : addl].filter(Boolean))].join(" · "),
          reference: xTxt(rmt,"Strd","CdtrRefInf","Ref") || (e2e && e2e!=="NOTPROVIDED" ? e2e : ""),
          bankRef: tRef || (nRef ? `${nRef}/${i}` : ""),
          origAmount:   instd && instdCcy && instdCcy!==currency ? Math.abs(parseFloat(instd.textContent)) : null,
          origCurrency: instd && instdCcy && instdCcy!==currency ? instdCcy : null,
        });
      });
    }
  }
  const info = [];
  if(split)   info.push(`${split} Sammelbuchung${split>1?"en":""} in Einzelzahlungen aufgeteilt`);
  if(skipped) info.push(`${skipped} nicht gebuchte (vorgemerkte) Positionen ignoriert`);
  const currencies = [...new Set(txs.map(t=>t.currency))];
  if(currencies.length>1) throw new Error(`Auszug enthält mehrere Währungen (${currencies.join(", ")}).`);
  return { format:kind[1], iban, currency: currencies[0] || xTxt(stmts[0],"Acct","Ccy") || CHF,
           txs: withImportKeys(txs, iban||kind[1]), info };
};

// ── CSV ─────────────────────────────────────────────────────────
// Spalten werden über bekannte Bezeichnungen erkannt (neon, PostFinance, UBS, Raiffeisen,
// ZKB, Revolut …). Vorspann-Zeilen vor der Kopfzeile werden übersprungen.
const CSV_COLS = {
  date:     ["date","datum","buchungsdatum","buchungstag","booking date","transaktionsdatum","abschlussdatum",
             "started date","completed date","valuta","valutadatum","value date"],
  amount:   ["amount","betrag","betrag chf","transaktionsbetrag","umsatz","einzelbetrag"],
  debit:    ["belastung","belastung chf","lastschrift","debit","soll","ausgang"],
  credit:   ["gutschrift","gutschrift chf","credit","haben","eingang"],
  currency: ["currency","währung","waehrung","whg","ccy"],
  party:    ["name","gegenpartei","empfänger","auftraggeber","begünstigter","zahlungsempfänger","payee",
             "merchant","counterparty"],
  iban:     ["iban","gegenkonto iban","konto gegenpartei","iban gegenpartei"],
  text:     ["description","buchungstext","beschreibung","text","details","avisierungstext","mitteilung",
             "mitteilungen","subject","verwendungszweck","zahlungszweck","beschreibung1","beschreibung2",
             "beschreibung3","category","kategorie"],
};
const normHeader = h => h.replace(/^﻿/,"").toLowerCase().replace(/\(.*?\)/g,"")
                         .replace(/[^a-z0-9äöüéèà ]/g," ").replace(/\s+/g," ").trim();

const splitCsvLine = (line, sep) => {
  const out = []; let cur = "", q = false;
  for(let i=0; i<line.length; i++){
    const ch = line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q = false; } else cur += ch; }
    else if(ch==='"') q = true;
    else if(ch===sep){ out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s=>s.trim());
};

const parseBankCsv = (text) => {
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  for(const sep of [";", ",", "\t"]){
    for(let h=0; h<Math.min(lines.length,40); h++){
      const head = splitCsvLine(lines[h], sep).map(normHeader);
      // exakt oder als Präfix («Gutschrift in CHF», «Betrag CHF»); Reihenfolge der Aliase = Priorität
      const hit = (h,a) => h===a || h.startsWith(a+" ");
      const col = k => CSV_COLS[k].map(a=>head.findIndex(h=>hit(h,a))).find(i=>i>=0) ?? -1;
      const c = { date:col("date"), amount:col("amount"), debit:col("debit"), credit:col("credit"),
                  currency:col("currency"), party:col("party"), iban:col("iban") };
      if(c.date<0 || (c.amount<0 && c.debit<0 && c.credit<0)) continue;
      const textCols = head.map((h,i)=>i).filter(i=>CSV_COLS.text.some(a=>hit(head[i],a)) && i!==c.party);
      const txs = [];
      for(const line of lines.slice(h+1)){
        const v = splitCsvLine(line, sep);
        const date = toIsoDate(v[c.date]);
        let amount;
        if(c.amount>=0) amount = parseAmount(v[c.amount]);
        else {
          const cr = Math.abs(parseAmount(v[c.credit])||0), db = Math.abs(parseAmount(v[c.debit])||0);
          amount = cr||db ? round2(cr-db) : NaN;
        }
        if(!date || isNaN(amount) || amount===0) continue;   // Summen-, Saldo- und Leerzeilen
        const texts = [...new Set(textCols.map(i=>v[i]).filter(Boolean))];
        txs.push({ date, amount, currency: (c.currency>=0 && v[c.currency]) ? v[c.currency].toUpperCase() : CHF,
                   counterparty: c.party>=0 ? v[c.party] : (texts[0]||""),
                   iban: c.iban>=0 ? v[c.iban].replace(/\s/g,"") : "",
                   text: (c.party>=0 ? texts : texts.slice(1)).join(" · "),
                   reference:"", bankRef:"", origAmount:null, origCurrency:null });
      }
      const currencies = [...new Set(txs.map(t=>t.currency))];
      if(currencies.length>1) throw new Error(`CSV enthält mehrere Währungen (${currencies.join(", ")}) – bitte pro Währung exportieren.`);
      return { format:"CSV", iban:"", currency: currencies[0]||CHF, txs: withImportKeys(txs,"csv"), info:[] };
    }
  }
  throw new Error("CSV-Kopfzeile nicht erkannt – benötigt mindestens eine Datums- und eine Betragsspalte "+
                  "(z. B. «Datum» und «Betrag» oder «Belastung»/«Gutschrift»).");
};

// Bankdateien kommen als UTF-8 oder Windows-1252
const decodeBankFile = (buf) => {
  try { return new TextDecoder("utf-8", { fatal:true }).decode(buf); }
  catch { return new TextDecoder("windows-1252").decode(buf); }
};
const parseStatement = (text) => text.trimStart().startsWith("<") ? parseCamt(text) : parseBankCsv(text);

// ── Lernen aus früheren Buchungen ───────────────────────────────
// Importierte Buchungen tragen bankCp/bankIban/bankKey. Gleiche Gegenpartei + gleiche Richtung
// → bisheriges Gegenkonto. Eindeutige Fälle werden ohne KI zugeordnet.
// bankKey = bereinigter Zahlungszweck (Ustrd): unterscheidet z. B. bei PayPal, wo Gegenpartei
// und IBAN immer gleich sind, die eigentlichen Händler.
const cpKey = s => String(s||"").toLowerCase().replace(/[^a-z0-9äöüàéèç]+/g," ").trim();
const TXT_STOP = new Set(("ihr ihre einkauf bei zahlung an von für fuer payment to from purchase at the and und der die das "+
  "abbuchung lastschrift gutschrift überweisung ueberweisung sepa auftrag ref referenz mitteilung abo").split(" "));
const txtKey = (text, cp) => {
  const own = new Set(cpKey(cp).split(" "));
  const words = String(text||"").toLowerCase().split(/\s+/)
    .filter(t=>!/\d/.test(t))                               // IDs, Daten, «PP.1234.PP» …
    .flatMap(t=>t.split(/[^a-z0-9äöüàéèç]+/))
    .filter(t=>t.length>1 && !TXT_STOP.has(t) && !own.has(t));
  return [...new Set(words)].slice(0,3).join(" ");
};
// Vom spezifischsten zum allgemeinsten Schlüssel
const histKeys = (dirSign, iban, cp, key) => {
  const c = cpKey(cp);
  return [key && c    && `${dirSign}|cp:${c}|txt:${key}`,
          key && iban && `${dirSign}|iban:${iban}|txt:${key}`,
          iban && `${dirSign}|iban:${iban}`,
          c    && `${dirSign}|cp:${c}`].filter(Boolean);
};
// Zahlungsdienstleister & Co.: Gegenpartei sagt nichts über den Zweck → Händler aus dem Text nehmen.
// Erkannt über bekannte Namen oder daran, dass die Gegenpartei bisher auf mehrere Konten ging.
const PASS_THROUGH = /paypal|stripe|sumup|twint|klarna|adyen|mollie|payrexx|datatrans|wallee|amazon pay/i;
const isPassThrough = (hist, tx) => PASS_THROUGH.test(tx.counterparty||"") ||
  histKeys(tx.amount>0?"+":"-", tx.iban, tx.counterparty).some(k=>Object.keys(hist.get(k)||{}).length>=2);
// Lesbarer Händlername aus dem Zahlungszweck, z. B.
// «1043 PP.8273.PP . Spotify AB, Ihr Einkauf bei Spotify AB» → «Spotify AB»
const merchantName = (text, cp) => {
  const own = new Set(cpKey(cp).split(" "));
  const ustrd = String(text||"").split(" · ")[0];
  const clean = ustrd.split(/\s+/).filter(t=>!/\d/.test(t)).join(" ");
  for(const seg of clean.split(/[,;]|\s[.\-–|/]\s/)){
    const words = seg.split(/\s+/).map(w=>w.replace(/^[^\p{L}]+|[^\p{L}.)]+$/gu,""))
      .filter(w=>w && !own.has(cpKey(w)));                                      // «PAYPAL *NETFLIX» → «NETFLIX»
    while(words.length && TXT_STOP.has(words[0].toLowerCase())) words.shift();   // «Ihr Einkauf bei …»
    if(words.length) return words.join(" ").slice(0,40);
  }
  return "";
};

// Eindeutig = häufigstes Konto ≥2× und ≥80 %
const histUnique = h => { const total = h.reduce((s,[,n])=>s+n,0); return !!h[0] && h[0][1]>=2 && h[0][1]/total>=0.8; };

const buildBankHistory = (entries, bankAcc) => {
  const m = new Map();
  for(const e of entries){
    if(!e.bankCp && !e.bankIban) continue;
    const inc = e.debit===bankAcc;
    const other = inc ? e.credit : e.credit===bankAcc ? e.debit : null;
    if(!other) continue;
    for(const k of histKeys(inc?"+":"-", e.bankIban, e.bankCp, e.bankKey)){
      const c = m.get(k) || {}; c[other] = (c[other]||0)+1; m.set(k,c);
    }
  }
  return m;
};
// → [[konto, anzahl], …] absteigend: der spezifischste eindeutige Schlüssel,
//   sonst der spezifischste vorhandene (nur als Hinweis für die KI)
const historyFor = (hist, tx) => {
  let first = null;
  for(const k of histKeys(tx.amount>0?"+":"-", tx.iban, tx.counterparty, tx.bankKey)){
    const c = hist.get(k);
    if(!c) continue;
    const h = Object.entries(c).sort((a,b)=>b[1]-a[1]);
    if(histUnique(h)) return h;
    first ||= h;
  }
  return first || [];
};

const BANK_MAP_KEY = "werckmeister_bank_map";   // IBAN → Kontonummer (nur Komfort, pro Browser)
const loadBankMap = () => { try { return JSON.parse(localStorage.getItem(BANK_MAP_KEY)||"{}"); } catch { return {}; } };
const saveBankMap = (iban, acc) => {
  if(!iban) return;
  try { localStorage.setItem(BANK_MAP_KEY, JSON.stringify({ ...loadBankMap(), [iban]:acc })); } catch {}
};
const LAST_BANK_KEY = "werckmeister_last_bank_acc";   // zuletzt gewähltes Bankkonto (pro Browser)
const saveLastBank = (acc) => { if(acc) try { localStorage.setItem(LAST_BANK_KEY, acc); } catch {} };
const guessBankAccount = (accounts, st) => {
  const mapped = loadBankMap()[st.iban];
  if(mapped && accounts.some(a=>a.number===mapped)) return mapped;
  let last = ""; try { last = localStorage.getItem(LAST_BANK_KEY)||""; } catch {}
  const lastAcc = accounts.find(a=>a.number===last);
  if(lastAcc && (lastAcc.currency||CHF)===st.currency) return last;
  const liquid = accounts.filter(a=>a.category==="aktiven" && a.number.startsWith("10") && (a.currency||CHF)===st.currency)
                         .sort((a,b)=>a.number.localeCompare(b.number));
  return (st.currency===CHF && liquid.find(a=>a.number==="1020")?.number) || liquid[0]?.number || "";
};

// ═══════════════════════════════════════════════════════════════
// TAB: BUCHUNGSASSISTENT (Claude oder lokales Modell)
// ═══════════════════════════════════════════════════════════════
function AssistentTab({ accounts, entries, setEntries, fxRates, year, settings }) {
  // ── Single-beleg state ──────────────────────────────────────
  const [mode,       setMode]       = useState("single"); // "single" | "bank"
  const [text,       setText]       = useState("");
  const [file,       setFile]       = useState(null);
  const [fileB64,    setFileB64]    = useState(null);
  const [fileMime,   setFileMime]   = useState(null);
  const [fileName,   setFileName]   = useState("");
  const [loading,    setLoading]    = useState(false);
  const [suggestion, setSuggestion] = useState(null);
  const [booked,     setBooked]     = useState(false);
  const [error,      setError]      = useState("");

  // ── Kontoauszug state ───────────────────────────────────────
  const [stmt,       setStmt]       = useState(null); // { format, iban, currency, info, fileName }
  const [rows,       setRows]       = useState([]);   // [{...tx, konto, text, why, source, selected, booked, dup, error}]
  const [bankAcc,    setBankAcc]    = useState("");
  const [rate,       setRate]       = useState("");   // CHF je 1 Fremdwährung (nur Fremdwährungsauszüge)
  const [stLoading,  setStLoading]  = useState(false);
  const [stProgress, setStProgress] = useState("");
  const accountList = accounts
    .sort((a,b)=>a.number.localeCompare(b.number))
    .map(a=>`${a.number} – ${a.name} (${a.category}${a.currency&&a.currency!==CHF?`, Währung ${a.currency}`:""})`)
    .join("\n");

  const systemPrompt = `Du bist Buchhalter für «${settings.name}» (Schweiz, doppelte Buchhaltung, ${settings.chartName||"eigener Kontenplan"}).
Verfügbare Konten:
${accountList}

Regeln:
- Bankkonto = Konto 1020, sofern im Kontenplan vorhanden und nichts anderes ersichtlich
- Negative Beträge = Geld fliesst aus dem Bankkonto heraus → Bankkonto ist HABEN (Kredit)
- Positive Beträge = Geld fliesst ins Bankkonto → Bankkonto ist SOLL (Debit)
- Bei privat vorgeschossenen Ausgaben: Haben = passendes Verbindlichkeits-/Kontokorrentkonto der Person (falls vorhanden)
- Nur Kontonummern verwenden die im Kontenplan vorkommen
- Betrag immer als positive Zahl
- Buchwährung ist CHF: "amount" ist immer der Betrag in CHF
- Wird ein Konto mit Fremdwährung (z.B. "Währung EUR") bebucht: zusätzlich "fxCurrency" (ISO-Code) und
  "fxAmount" (positiver Betrag in Fremdwährung) angeben; "amount" = CHF zum Kurs gemäss Beleg bzw. Tageskurs
- Aufwand und Ertrag immer in CHF; Fremdwährungsbeträge auf CHF-Konten in CHF umrechnen (fxCurrency/fxAmount = null)
- Rechnungs-/Belegnummer des Absenders (falls vorhanden) in den Buchungstext aufnehmen
- Kein Markdown, nur reines JSON`;

  // Fremdwährungsfelder eines KI-Vorschlags für das Formular aufbereiten
  const prepFx = (s) => {
    if(!s || typeof s!=="object") return null;
    const fx = parseNum(s.fxAmount), amt = parseNum(s.amount);
    const str = v => v==null ? "" : String(v).trim();
    // Typen vereinheitlichen: lokale Modelle liefern Kontonummern oft als Zahl, Beträge als String
    return { ...s, date:str(s.date), description:str(s.description), reference:"", refAuto:true,
             debit:str(s.debit), credit:str(s.credit), amount: isNaN(amt) ? "" : Math.abs(amt),
             fxAmount: fx>0 ? String(fx) : "", fxRate: fx>0&&amt>0 ? String(+(amt/fx).toFixed(6)) : "",
             fxReval:false };
  };

  // ── Single beleg handlers ───────────────────────────────────
  const handleFile = (e) => {
    const f = e.target.files[0]; if(!f) return;
    setFileName(f.name);
    const mime = f.type||(f.name.endsWith(".pdf")?"application/pdf":"image/jpeg");
    setFileMime(mime);
    const reader = new FileReader();
    reader.onload = ev => { setFileB64(ev.target.result.split(",")[1]); setFile(f); };
    reader.readAsDataURL(f);
    e.target.value="";
  };
  const removeFile = () => { setFile(null); setFileB64(null); setFileMime(null); setFileName(""); };

  const analyse = async () => {
    if(!text.trim()&&!fileB64){ setError("Bitte Beleg beschreiben oder Datei hochladen."); return; }
    setError(""); setLoading(true); setSuggestion(null); setBooked(false);
    const parts = [];
    if(fileB64&&fileMime) {
      parts.push(fileMime==="application/pdf"
        ? { type:"pdf", data:fileB64 }
        : { type:"image", mime:fileMime, data:fileB64 });
    }
    parts.push({ type:"text", text: text.trim()||"Analysiere diesen Beleg und schlage eine Buchung vor." });
    try {
      const raw = await callLLM({
        system: systemPrompt+"\n\nAntworte NUR mit einem JSON-Objekt:\n{\"date\":\"YYYY-MM-DD\",\"description\":\"...\",\"debit\":\"NNNN\",\"credit\":\"NNNN\",\"amount\":0.00,\"fxCurrency\":null,\"fxAmount\":null,\"reasoning\":\"...\"}",
        parts, maxTokens:1000,
      });
      let parsed = parseLLMJson(raw);
      if(Array.isArray(parsed)) parsed = parsed[0];
      const s = prepFx(parsed);
      if(!s) throw new Error("Antwort des Modells enthält keine Buchung");
      setSuggestion(s);
    } catch(err){ setError("Fehler: "+err.message); }
    setLoading(false);
  };

  const suggRef = suggestion
    ? (suggestion.refAuto ? nextReference(entries, suggestion.date) : suggestion.reference) : "";

  const bookSingle = () => {
    if(!suggestion) return;
    const accErr = checkSuggestionAccounts(suggestion, accounts);
    if(accErr){ setError(accErr); return; }
    const { entry, error } = normalizeEntry({ ...suggestion, reference:suggRef }, accounts);
    if(error){ setError(error); return; }
    setSuggestion(p=>({ ...p, reference:suggRef, refAuto:false }));
    setEntries(p=>[...p,{ ...entry, id:newEntryId() }]);
    setError("");
    setBooked(true);
  };
  const sf = (k,v) => setSuggestion(p=>fxFormUpdate(p,k,v));

  const resetSingle = () => { setText(""); removeFile(); setSuggestion(null); setBooked(false); setError(""); };

  // ── Kontoauszug handlers ────────────────────────────────────
  // Datum, Betrag und Bankkonto kommen aus der Datei bzw. der Auswahl – die KI wählt nur das Gegenkonto.
  const defaultText = r => (r.merchant
    ? (r.counterparty ? `${r.counterparty.split(/\s+/)[0]}: ${r.merchant}` : r.merchant)
    : (r.counterparty || r.text || "Bankbuchung")).slice(0,60);

  // Eindeutige frühere Zuordnungen (≥2×, ≥80 %) direkt übernehmen
  const applyHistory = (list, acc) => {
    const hist = buildBankHistory(entries, acc);
    return list.map(r=>{
      r = { ...r, merchant: isPassThrough(hist, r) ? merchantName(r.bankText, r.counterparty) : "" };
      if(r.booked || r.dup || r.source==="ki" || r.source==="manuell") return r;
      const h = historyFor(hist, r);
      const [konto, n] = h[0] || [];
      if(histUnique(h) && konto!==acc && accounts.some(a=>a.number===konto))
        return { ...r, konto, text: r.text || defaultText(r),
                 why:`Bisher ${n}× auf ${konto} gebucht`, source:"verlauf" };
      return r.source==="verlauf" ? { ...r, konto:"", why:"", source:"" } : r;
    });
  };

  const handleStatement = async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    setError("");
    try {
      const st = parseStatement(decodeBankFile(await f.arrayBuffer()));
      if(!st.txs.length) throw new Error("Keine gebuchten Transaktionen in der Datei gefunden.");
      const acc  = guessBankAccount(accounts, st);
      const done = new Set(entries.map(x=>x.importId).filter(Boolean));
      setStmt({ format:st.format, iban:st.iban, currency:st.currency, info:st.info, fileName:f.name });
      setBankAcc(acc);
      setRate(st.currency!==CHF ? String(fxRates?.[year]?.[st.currency]||"") : "");
      setRows(applyHistory(st.txs.map(t=>({ ...t, bankText:t.text, bankKey:txtKey(t.text, t.counterparty), konto:"", text:"", why:"", source:"",
        dup:done.has(t.key), selected:!done.has(t.key), booked:done.has(t.key), error:"" })), acc));
    } catch(err){ setError(err.message); }
  };

  const changeBankAcc = (acc) => { setBankAcc(acc); saveLastBank(acc); setRows(prev=>applyHistory(prev, acc)); };
  const resetStatement = () => { setStmt(null); setRows([]); setError(""); setStProgress(""); };

  const analyseStatement = async () => {
    const todo = rows.map((r,i)=>({ r, i })).filter(({r})=>!r.konto && !r.booked);
    if(!todo.length || !bankAcc) return;
    setStLoading(true); setError("");
    const bank = accounts.find(a=>a.number===bankAcc);
    const choices = accounts.filter(a=>a.number!==bankAcc).sort((a,b)=>a.number.localeCompare(b.number));
    const hist = buildBankHistory(entries, bankAcc);
    const system = `Du bist Buchhalter für «${settings.name}» (Schweiz, doppelte Buchhaltung, ${settings.chartName||"eigener Kontenplan"}).
Du ordnest Transaktionen des Bankkontos ${bank.number} «${bank.name}» dem passenden GEGENKONTO zu.
Datum, Betrag und Bankkonto stehen fest und werden nicht von dir geliefert.

Mögliche Gegenkonten:
${choices.map(a=>`${a.number} – ${a.name} (${a.category}${a.currency&&a.currency!==CHF?`, Währung ${a.currency}`:""})`).join("\n")}

Regeln:
- EINGANG = Geld kommt aufs Bankkonto (z. B. Mitgliederbeiträge, Spenden, Erträge, Zahlungen von Debitoren, Darlehen)
- AUSGANG = Geld verlässt das Bankkonto (z. B. Aufwand, Zahlungen an Kreditoren, Rückzahlungen)
- Überträge zwischen eigenen Konten → das andere Konto der flüssigen Mittel
- Bankspesen und Kontoführungsgebühren → passendes Aufwandkonto für Bankspesen/Finanzaufwand
- «Früher gebucht auf» ist ein starker Hinweis, wenn er zur Transaktion passt
- Nur Kontonummern aus der Liste verwenden
- "text": kurzer Buchungstext auf Deutsch (max. 60 Zeichen)
- Kein Markdown, nur reines JSON`;
    const schema = { type:"object", additionalProperties:false, required:["zuordnungen"], properties:{
      zuordnungen:{ type:"array", items:{ type:"object", additionalProperties:false,
        required:["nr","konto","text","begruendung"],
        properties:{ nr:{type:"integer"}, konto:{type:"string", enum:choices.map(a=>a.number)},
                     text:{type:"string"}, begruendung:{type:"string"} } } } } };

    const size = LLM_CONFIG.csvBatchSize > 0 ? LLM_CONFIG.csvBatchSize : todo.length;
    const batches = [];
    for(let i=0; i<todo.length; i+=size) batches.push(todo.slice(i,i+size));
    const errors = [];
    const patch = (idx, fn) => setRows(prev=>prev.map((r,j)=>idx.includes(j) ? fn(r,j) : r));

    for(let b=0; b<batches.length; b++){
      const batch = batches[b];
      setStProgress(batches.length>1 ? `Block ${b+1}/${batches.length}` : "");
      const lines = batch.map(({r},k)=>{
        const h = historyFor(hist, r).slice(0,2).map(([a,n])=>`${a} (${n}×)`).join(", ");
        return `${k+1}. ${r.amount>0?"EINGANG":"AUSGANG"} ${r.currency} ${fmt(Math.abs(r.amount))} · ${r.date}`+
               ` · Gegenpartei: ${r.counterparty||"—"}`+
               (r.bankText ? ` · Text: ${r.bankText.slice(0,300)}` : "")+
               (r.reference ? ` · Referenz: ${r.reference}` : "")+
               (h ? ` · Früher gebucht auf: ${h}` : "");
      }).join("\n");
      const prompt = `Ordne diese ${batch.length} Transaktionen zu.

${lines}

Antworte NUR mit JSON, genau ein Eintrag pro Transaktion, "nr" wie oben:
{"zuordnungen":[{"nr":1,"konto":"NNNN","text":"kurzer Buchungstext","begruendung":"kurz"}]}`;
      const idx = batch.map(x=>x.i);
      try {
        const raw = await callLLM({ system, parts:[{ type:"text", text:prompt }], schema,
                                    maxTokens: Math.max(800, batch.length*150) });
        const parsed = parseLLMJson(raw);
        const list = Array.isArray(parsed) ? parsed : (parsed.zuordnungen || parsed.buchungen || []);
        if(!Array.isArray(list) || !list.length) throw new Error("Antwort enthält keine Zuordnungen");
        // Zuordnung über "nr"; fehlt sie, nach Reihenfolge
        const byNr = new Map();
        list.forEach((x,k)=>{ const nr = parseInt(x?.nr); byNr.set(nr>0 ? nr : k+1, x); });
        patch(idx, (r,j)=>{
          const x = byNr.get(idx.indexOf(j)+1);
          if(!x) return { ...r, error:"Modell hat diese Transaktion ausgelassen – Gegenkonto bitte wählen" };
          const konto = String(x.konto ?? x.account ?? "").trim();
          const text  = String(x.text ?? x.description ?? "").trim().slice(0,80) || defaultText(r);
          const ok    = accounts.some(a=>a.number===konto) && konto!==bankAcc;
          return { ...r, konto: ok ? konto : "", text, why: String(x.begruendung ?? x.reasoning ?? ""),
                   source: ok ? "ki" : "", error: ok ? "" : `Vorgeschlagenes Konto «${konto||"—"}» ist ungültig – bitte wählen` };
        });
      } catch(err){
        errors.push(`Block ${b+1}: ${err.message}`);
        patch(idx, r=>({ ...r, error:err.message }));
      }
    }
    if(errors.length) setError("Analyse: "+errors.join(" · "));
    setStProgress("");
    setStLoading(false);
  };

  const bankAccount = accounts.find(a=>a.number===bankAcc);
  const bankCur     = bankAccount?.currency || CHF;
  const ccyMismatch = !!(stmt && bankAccount && bankCur!==stmt.currency);
  const rateNum     = parseNum(rate);

  // Buchung aus Transaktion: Bankkonto im Soll bei Eingang, im Haben bei Ausgang
  const statementEntry = (r) => {
    const abs = round2(Math.abs(r.amount));
    let amount = abs, fxAmount = "";
    if(bankCur!==CHF){
      if(!(rateNum>0)) return { error:`Kurs CHF je 1 ${bankCur} fehlt` };
      amount = round2(abs*rateNum); fxAmount = abs;
    } else if(accCurrency(accounts, r.konto)!==CHF && r.origCurrency===accCurrency(accounts, r.konto)){
      fxAmount = r.origAmount;   // CHF-Zahlung auf Fremdwährungskonto: Originalbetrag aus camt
    }
    const inc = r.amount>0;
    return normalizeEntry({ date:r.date, description:r.text || defaultText(r), reference:"",
      debit: inc ? bankAcc : r.konto, credit: inc ? r.konto : bankAcc, amount, fxAmount,
      importId:r.key, bankCp:r.counterparty, bankIban:r.iban, bankKey:r.bankKey }, accounts);
  };

  const bookStatement = () => {
    const newEntries = [];
    const next = rows.map(r=>{
      if(!r.selected || r.booked || !r.konto) return r;
      if(r.konto===bankAcc) return { ...r, error:"Gegenkonto = Bankkonto" };
      const { entry, error } = statementEntry(r);
      if(error) return { ...r, error };
      newEntries.push({ ...entry, id:newEntryId() });
      return { ...r, booked:true, error:"" };
    });
    if(newEntries.length){
      // fortlaufende Belegnummern in chronologischer Reihenfolge vergeben
      const given = [];
      newEntries.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        e.reference = nextReference(entries, e.date, given); given.push(e.reference);
      });
      setEntries(p=>[...p, ...newEntries]); saveBankMap(stmt?.iban, bankAcc); saveLastBank(bankAcc);
    }
    setRows(next);
  };

  const toggleRow  = (i) => setRows(prev=>prev.map((r,j)=>j===i?{...r,selected:!r.selected}:r));
  const toggleAll  = (v) => setRows(prev=>prev.map(r=>r.booked?r:{...r,selected:v}));
  const setKonto   = (i,v) => setRows(prev=>prev.map((r,j)=>j===i?{...r,konto:v,source:v?"manuell":"",
                                         text:r.text||defaultText(r),error:""}:r));
  const setRowText = (i,v) => setRows(prev=>prev.map((r,j)=>j===i?{...r,text:v}:r));

  const accName = n => accounts.find(a=>a.number===n)?.name||"—";
  const catColor = {aktiven:"#1D4ED8",passiven:"#15803D",ertrag:"#059669",aufwand:"#DC2626"};
  const accColor = n => { const a=accounts.find(x=>x.number===n); return a?catColor[a.category]:MUTED; };

  return (
    <div style={{maxWidth:900,margin:"0 auto"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0F2460,#1e3a8a)",borderRadius:12,
                   padding:"20px 24px",marginBottom:20,color:"white"}}>
        <div style={{fontWeight:800,fontSize:17,letterSpacing:-.3}}>🤖 Buchungsassistent</div>
        <div style={{fontSize:12,opacity:.7,marginTop:4}}>
          Einzelbeleg beschreiben oder hochladen — oder Kontoauszug (camt.053 / CSV) importieren
        </div>
        <div style={{fontSize:11,opacity:.55,marginTop:6}}>
          KI: {LLM_LABEL}{LLM_CONFIG.provider==="openai" ? ` · ${LLM_CONFIG.baseUrl}` : ""}
        </div>
      </div>

      {/* Mode switcher */}
      <div style={{display:"flex",gap:0,marginBottom:20,background:"white",borderRadius:8,
                   border:"1px solid #E2E8F0",padding:4,width:"fit-content"}}>
        {[["single","📎 Einzelbeleg"],["bank","🏦 Kontoauszug"]].map(([m,label])=>(
          <button key={m} onClick={()=>setMode(m)} style={{
            padding:"7px 18px",border:"none",borderRadius:6,cursor:"pointer",
            fontSize:13,fontWeight:mode===m?700:400,fontFamily:"inherit",
            background:mode===m?"#0F2460":"transparent",
            color:mode===m?"white":"#64748B",transition:"all .15s"
          }}>{label}</button>
        ))}
      </div>

      {/* ── SINGLE MODE ── */}
      {mode==="single" && !suggestion && !booked && (
        <Card title="Beleg eingeben">
          <Field label="Beleg beschreiben (auf Deutsch)">
            <textarea value={text} onChange={e=>setText(e.target.value)}
              placeholder={"z.B. «Rechnung Raskin Apps vom 31.8.2025, CHF 88'500, Ideation mit Buyout, langfristiges Darlehen»\noder «Wohnsitzbestätigung Stadt Zürich, CHF 20, von mahal privat bezahlt, Belegnr. 391090»"}
              style={{...IS,height:100,resize:"vertical",lineHeight:1.5,fontSize:13}}/>
          </Field>
          <div style={{marginTop:12}}>
            <label style={{display:"block",fontSize:10.5,fontWeight:700,color:"#64748B",
                           marginBottom:6,textTransform:"uppercase",letterSpacing:.6}}>
              Oder Beleg hochladen (PDF / Bild)
            </label>
            {!file ? (
              <label style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,
                             padding:"22px 16px",border:"2px dashed #CBD5E1",borderRadius:8,
                             cursor:"pointer",background:"#F8FAFC",fontSize:13,color:MUTED,
                             transition:"border-color .15s"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor="#0F2460"}
                onMouseLeave={e=>e.currentTarget.style.borderColor="#CBD5E1"}>
                <span style={{fontSize:26}}>📎</span>
                <span>PDF oder Bild hochladen</span>
                <input type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" onChange={handleFile} style={{display:"none"}}/>
              </label>
            ) : (
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
                           background:"#EFF6FF",borderRadius:8,border:"1px solid #BFDBFE"}}>
                <span style={{fontSize:20}}>{fileMime==="application/pdf"?"📄":"🖼"}</span>
                <span style={{fontSize:13,fontWeight:500,flex:1,color:"#1D4ED8"}}>{fileName}</span>
                <button onClick={removeFile} style={{background:"none",border:"none",color:MUTED,cursor:"pointer",fontSize:18}}>×</button>
              </div>
            )}
          </div>
          {error&&<div style={{marginTop:10,padding:"7px 10px",background:"#FEF2F2",borderRadius:5,color:"#DC2626",fontSize:12}}>⚠ {error}</div>}
          <div style={{marginTop:14,display:"flex",justifyContent:"flex-end"}}>
            <button onClick={analyse} disabled={loading}
              style={{...PB,opacity:loading?.6:1,cursor:loading?"wait":"pointer",display:"flex",alignItems:"center",gap:8}}>
              {loading?<><span style={{display:"inline-block",width:14,height:14,border:"2px solid rgba(255,255,255,.3)",borderTop:"2px solid white",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>Analysiere…</>:<>🔍 Beleg analysieren</>}
            </button>
          </div>
        </Card>
      )}

      {mode==="single" && suggestion && !booked && (
        <Card title="Buchungsvorschlag">
          <div style={{padding:"10px 12px",background:"#F0F9FF",borderRadius:7,
                       borderLeft:"3px solid #0284C7",marginBottom:16,fontSize:13,color:"#0369A1"}}>
            💡 {suggestion.reasoning}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
            <div><Field label="Datum"><input type="date" value={suggestion.date}
              onChange={e=>setSuggestion(p=>({...p,date:e.target.value}))} style={{...IS,fontSize:13}}/></Field></div>
            <div style={{gridColumn:"span 2"}}><Field label="Buchungstext"><input type="text" value={suggestion.description}
              onChange={e=>setSuggestion(p=>({...p,description:e.target.value}))} style={{...IS,fontSize:13}}/></Field></div>
            <div><Field label="Belegnummer"><input type="text" value={suggRef}
              onChange={e=>setSuggestion(p=>({...p,reference:e.target.value,refAuto:false}))}
              title={suggestion.refAuto ? "Automatisch: nächste freie Belegnummer" : "Manuell gesetzt"}
              style={{...IS,fontSize:13,color:suggestion.refAuto?"#64748B":undefined}}/></Field></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 160px",gap:10,marginBottom:16}}>
            <Field label="Soll (Debit)"><AccountSelect accounts={accounts} value={suggestion.debit} onChange={v=>sf("debit",v)}/></Field>
            <Field label="Haben (Kredit)"><AccountSelect accounts={accounts} value={suggestion.credit} onChange={v=>sf("credit",v)}/></Field>
            <Field label="Betrag CHF"><input type="number" step="0.05" value={suggestion.amount}
              onChange={e=>sf("amount",e.target.value)}
              style={{...IS,fontFamily:"'JetBrains Mono',monospace",textAlign:"right",fontSize:15,fontWeight:700}}/></Field>
          </div>
          <div style={{marginTop:-6,marginBottom:14}}>
            <FxInputs accounts={accounts} value={suggestion} onChange={sf}/>
          </div>
          {error&&<div style={{marginBottom:12,padding:"7px 10px",background:"#FEF2F2",borderRadius:5,color:"#DC2626",fontSize:12}}>⚠ {error}</div>}
          <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"#F8FAFC",borderRadius:8,marginBottom:16}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:10,color:MUTED,marginBottom:2}}>SOLL</div>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:800,fontSize:15,color:accColor(suggestion.debit)}}>{suggestion.debit}</span>
              <div style={{fontSize:11,color:"#64748B"}}>{accName(suggestion.debit)}</div>
            </div>
            <div style={{fontSize:20,color:"#CBD5E1",flex:1,textAlign:"center"}}>→</div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:10,color:MUTED,marginBottom:2}}>BETRAG</div>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:800,fontSize:18}}>CHF {fmt(suggestion.amount)}</span>
            </div>
            <div style={{fontSize:20,color:"#CBD5E1",flex:1,textAlign:"center"}}>→</div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:10,color:MUTED,marginBottom:2}}>HABEN</div>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:800,fontSize:15,color:accColor(suggestion.credit)}}>{suggestion.credit}</span>
              <div style={{fontSize:11,color:"#64748B"}}>{accName(suggestion.credit)}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
            <button onClick={resetSingle} style={SB}>← Neuer Beleg</button>
            <button onClick={bookSingle} style={{...PB,background:"#16A34A",padding:"9px 24px",fontSize:14}}>
              ✓ Buchung ins Journal
            </button>
          </div>
        </Card>
      )}

      {mode==="single" && booked && (
        <div style={{background:"#F0FDF4",border:"2px solid #16A34A",borderRadius:12,padding:"24px",textAlign:"center"}}>
          <div style={{fontSize:36,marginBottom:8}}>✅</div>
          <div style={{fontWeight:800,fontSize:16,color:"#15803D",marginBottom:4}}>Buchung erfasst!</div>
          <div style={{fontSize:13,color:"#64748B",marginBottom:16}}>
            {suggestion.date} · {suggestion.description} · CHF {fmt(suggestion.amount)}
          </div>
          <button onClick={resetSingle} style={{...PB,background:"#15803D"}}>+ Nächsten Beleg</button>
        </div>
      )}

      {/* ── KONTOAUSZUG ── */}
      {mode==="bank" && !stmt && (
        <Card title="Kontoauszug importieren">
          <div style={{fontSize:13,color:"#64748B",marginBottom:14,lineHeight:1.6}}>
            Empfohlen: <strong>camt.053</strong> (ISO 20022 XML, im E-Banking unter «Kontoauszug / camt» exportieren).
            Ebenfalls möglich: camt.052/.054 sowie <strong>CSV</strong> der meisten Banken (Spalten werden automatisch erkannt).<br/>
            Datum und Betrag werden direkt aus der Datei übernommen — {LLM_LABEL} schlägt nur das <strong>Gegenkonto</strong> und
            den Buchungstext vor. Gegenparteien, die du schon mehrfach gleich gebucht hast, werden ohne KI zugeordnet.
          </div>
          <label style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,
                         padding:"32px 16px",border:"2px dashed #CBD5E1",borderRadius:8,
                         cursor:"pointer",background:"#F8FAFC",fontSize:13,color:MUTED,
                         transition:"border-color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="#0F2460"}
            onMouseLeave={e=>e.currentTarget.style.borderColor="#CBD5E1"}>
            <span style={{fontSize:36}}>🏦</span>
            <span style={{fontWeight:600,color:"#334155"}}>Kontoauszug hochladen</span>
            <span style={{fontSize:11}}>camt.053 / .052 / .054 (XML) · CSV</span>
            <input type="file" accept=".xml,.csv,.txt" onChange={handleStatement} style={{display:"none"}}/>
          </label>
          {error&&<div style={{marginTop:10,padding:"7px 10px",background:"#FEF2F2",borderRadius:5,color:"#DC2626",fontSize:12}}>⚠ {error}</div>}
        </Card>
      )}

      {mode==="bank" && stmt && (()=>{
        const open      = rows.filter(r=>!r.booked);
        const todoCount = open.filter(r=>!r.konto).length;
        const readyCount= open.filter(r=>r.selected&&r.konto).length;
        const dupCount  = rows.filter(r=>r.dup).length;
        const booked    = rows.filter(r=>r.booked&&!r.dup).length;
        const fromHist  = open.filter(r=>r.source==="verlauf").length;
        const canBook   = readyCount>0 && !ccyMismatch && (bankCur===CHF || rateNum>0);
        const srcBadge  = { verlauf:["Verlauf","#7C3AED","#F5F3FF"], ki:["KI","#0369A1","#F0F9FF"], manuell:["manuell","#475569","#F1F5F9"] };
        return (
        <div>
          {/* Auszug-Info und Bankkonto */}
          <div style={{background:"white",borderRadius:10,border:"1px solid #E2E8F0",padding:"12px 16px",marginBottom:12,
                       display:"flex",gap:16,alignItems:"flex-end",flexWrap:"wrap"}}>
            <div style={{flex:"1 1 260px",fontSize:12,color:"#475569",lineHeight:1.6}}>
              <div style={{fontWeight:700,color:"#0F2460",fontSize:13}}>{stmt.fileName}</div>
              {stmt.format}{stmt.iban?` · ${stmt.iban}`:""} · {stmt.currency} · {rows.length} Transaktionen
              {dupCount>0&&<> · {dupCount} bereits importiert</>}
              {fromHist>0&&<> · {fromHist} aus Verlauf zugeordnet</>}
              {stmt.info.map((x,i)=><div key={i} style={{fontSize:11,color:MUTED}}>ℹ {x}</div>)}
            </div>
            <Field label="Bankkonto im Kontenplan" style={{flex:"0 1 260px"}}>
              <select value={bankAcc} onChange={e=>changeBankAcc(e.target.value)} style={{...IS,fontSize:13}}>
                <option value="">— wählen —</option>
                {[["aktiven","Aktiven"],["passiven","Passiven"]].map(([cat,label])=>(
                  <optgroup key={cat} label={label}>
                    {accounts.filter(a=>a.category===cat).sort((a,b)=>a.number.localeCompare(b.number)).map(a=>(
                      <option key={a.number} value={a.number}>{a.number} – {a.name}{a.currency&&a.currency!==CHF?` [${a.currency}]`:""}</option>
                    ))}
                  </optgroup>
                ))}
              </select>
            </Field>
            {bankCur!==CHF&&!ccyMismatch&&(
              <Field label={`Kurs CHF je 1 ${bankCur}`} style={{flex:"0 1 150px"}}>
                <input type="number" step="0.0001" value={rate} onChange={e=>setRate(e.target.value)}
                  style={{...IS,fontSize:13,fontFamily:"'JetBrains Mono',monospace",textAlign:"right"}}/>
              </Field>
            )}
          </div>
          {ccyMismatch&&(
            <div style={{marginBottom:12,padding:"7px 10px",background:"#FEF2F2",borderRadius:5,color:"#DC2626",fontSize:12}}>
              ⚠ Der Auszug ist in {stmt.currency}, Konto {bankAcc} aber in {bankCur} – bitte ein {stmt.currency}-Konto wählen
              (Fremdwährungskonto im Kontenplan anlegen).
            </div>
          )}
          {bankCur!==CHF&&!ccyMismatch&&(
            <div style={{marginBottom:12,fontSize:11,color:MUTED}}>
              CHF-Betrag = {bankCur}-Betrag × Kurs (für alle Zeilen; im Journal pro Buchung anpassbar).
            </div>
          )}

          {/* Toolbar */}
          <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
            {booked>0&&<span style={{background:"#F0FDF4",color:"#15803D",padding:"2px 9px",borderRadius:999,fontSize:11,fontWeight:600}}>✓ {booked} gebucht</span>}
            <div style={{flex:1}}/>
            <button onClick={resetStatement} style={SB}>× Anderer Auszug</button>
            {todoCount>0&&(
              <button onClick={analyseStatement} disabled={stLoading||!bankAcc}
                style={{...PB,display:"flex",alignItems:"center",gap:8,opacity:stLoading||!bankAcc?.6:1}}>
                {stLoading
                  ?<><span style={{display:"inline-block",width:14,height:14,border:"2px solid rgba(255,255,255,.3)",borderTop:"2px solid white",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>Analysiere {todoCount}{stProgress?` (${stProgress})`:""}…</>
                  :<>🔍 Gegenkonten für {todoCount} vorschlagen</>}
              </button>
            )}
            {readyCount>0&&(
              <button onClick={bookStatement} disabled={!canBook}
                style={{...PB,background:"#16A34A",display:"flex",alignItems:"center",gap:6,opacity:canBook?1:.5}}>
                ✓ {readyCount} ausgewählte buchen
              </button>
            )}
          </div>
          {error&&<div style={{marginBottom:12,padding:"7px 10px",background:"#FEF2F2",borderRadius:5,color:"#DC2626",fontSize:12}}>⚠ {error}</div>}

          {/* Tabelle */}
          <div style={{background:"white",borderRadius:10,border:"1px solid #E2E8F0",overflow:"auto",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}>
              <thead>
                <tr>
                  <Th style={{width:36}}>
                    <input type="checkbox" checked={open.length>0&&open.every(r=>r.selected)}
                      onChange={e=>toggleAll(e.target.checked)}/>
                  </Th>
                  <Th style={{width:92}}>Datum</Th>
                  <Th align="right" style={{width:110}}>Betrag {stmt.currency}</Th>
                  <Th>Gegenpartei / Text</Th>
                  <Th style={{width:200}}>Gegenkonto</Th>
                  <Th style={{width:200}}>Buchungstext</Th>
                  <Th style={{width:70}}/>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i)=>{
                  const inc = r.amount>0;
                  const badge = srcBadge[r.source];
                  return (
                    <tr key={r.key} style={{opacity:r.booked?.5:1,
                                            background:r.booked?"#F0FDF4":r.selected?"white":"#FAFAFA"}}>
                      <Td>
                        {r.booked
                          ? <span style={{color:"#15803D",fontWeight:700,fontSize:13}} title={r.dup?"bereits früher importiert":"gebucht"}>✓</span>
                          : <input type="checkbox" checked={r.selected} onChange={()=>toggleRow(i)}/>}
                      </Td>
                      <Td style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#475569"}}>{r.date}</Td>
                      <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,
                        fontWeight:600,color:inc?"#059669":"#DC2626"}}>
                        {inc?"+":"−"}{fmt(Math.abs(r.amount))}
                      </Td>
                      <Td style={{fontSize:12,color:"#334155"}}>
                        <div style={{fontWeight:500}}>{r.counterparty||"—"}</div>
                        {r.bankText&&<div style={{fontSize:10,color:MUTED,maxWidth:340,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}
                                          title={r.bankText}>{r.bankText}</div>}
                        {r.dup&&<div style={{fontSize:10,color:"#15803D"}}>bereits importiert</div>}
                      </Td>
                      <Td>
                        <select value={r.konto} disabled={r.booked} onChange={e=>setKonto(i,e.target.value)}
                          style={{...IS,padding:"3px 6px",fontSize:11,width:"100%",
                                  fontWeight:r.konto?700:400,color:r.konto?accColor(r.konto):MUTED}}>
                          <option value="">— Gegenkonto —</option>
                          {accounts.filter(a=>a.number!==bankAcc).sort((a,b)=>a.number.localeCompare(b.number)).map(a=>(
                            <option key={a.number} value={a.number}>{a.number} {a.name}</option>
                          ))}
                        </select>
                        {r.konto&&bankAcc&&(
                          <div style={{fontSize:10,color:MUTED,marginTop:2,fontFamily:"'JetBrains Mono',monospace"}}>
                            S {inc?bankAcc:r.konto} · H {inc?r.konto:bankAcc}
                          </div>
                        )}
                      </Td>
                      <Td>
                        <input value={r.text} disabled={r.booked} placeholder={defaultText(r)}
                          onChange={e=>setRowText(i,e.target.value)}
                          style={{...IS,padding:"3px 6px",fontSize:11,width:"100%"}}/>
                      </Td>
                      <Td>
                        <div style={{display:"flex",gap:4,alignItems:"center"}}>
                          {badge&&!r.booked&&(
                            <span title={r.why||""} style={{fontSize:9.5,fontWeight:700,padding:"1px 6px",borderRadius:999,
                                         color:badge[1],background:badge[2],cursor:r.why?"help":"default"}}>{badge[0]}</span>
                          )}
                          {r.error&&!r.booked&&(
                            <span style={{fontSize:12,color:"#DC2626",cursor:"help"}} title={r.error}>⚠</span>
                          )}
                        </div>
                      </Td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{marginTop:10,fontSize:12,color:"#64748B",textAlign:"center"}}>
            Badge «Verlauf» = aus früheren Buchungen · «KI» = Vorschlag {LLM_LABEL} (Hover für Begründung) · Gegenkonto und Text sind editierbar
          </div>
        </div>
        );
      })()}

      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

// TAB: EINSTELLUNGEN (Name, Kontenplan-Vorlage, Kontenplan Import/Export)
// ═══════════════════════════════════════════════════════════════
function EinstellungenTab({ accounts, setAccounts, entries, settings, setSettings }) {
  const [vorlageId, setVorlageId] = useState(APP_CONFIG.defaultVorlage);
  const [busy,  setBusy]  = useState(false);
  const [msg,   setMsg]   = useState("");
  const [errs,  setErrs]  = useState([]);

  const setName = (v) => setSettings(p=>({ ...p, name:v }));
  const fixName = () => { if(!String(settings.name||"").trim()) setName(DEFAULT_ORG_NAME); else setName(settings.name.trim()); };

  // Neuen Kontenplan übernehmen (Vorlage oder Import) – mit Abgleich gegen bestehende Buchungen
  const applyChart = (c, fallbackName) => {
    setMsg(""); setErrs([]);
    if(c.errors.length){ setErrs(c.errors); return; }
    const m = mergeChartWithEntries(c.accounts, accounts, entries);
    if(m.errors.length){ setErrs(m.errors); return; }
    const name = c.name || fallbackName;
    const lines = [`Kontenplan «${name}» mit ${c.accounts.length} Konten übernehmen?`,
                   `Der bisherige Kontenplan (${accounts.length} Konten) wird ersetzt. Buchungen bleiben erhalten.`];
    if(m.kept.length) lines.push("", `${m.kept.length} Konten mit Buchungen fehlen in der Vorlage und werden beibehalten:`,
                                 m.kept.map(a=>`${a.number} ${a.name}`).join(", "));
    if(m.changedCat.length) lines.push("", "Achtung, Kategorie ändert sich bei bebuchten Konten: "+m.changedCat.join(", "));
    lines.push("", "Tipp: vorher im Journal ein JSON-Backup erstellen.");
    if(!window.confirm(lines.join("\n"))) return;
    setAccounts(m.accounts);
    setSettings(p=>({ ...p, chartName:name,
      fxAccounts: c.fxAccounts || { gain:FX_GAIN_ACCOUNT.number, loss:FX_LOSS_ACCOUNT.number },
      resultAccount: c.resultAccount || DEFAULT_RESULT_ACCOUNT }));
    setMsg(`✓ Kontenplan «${name}» übernommen (${m.accounts.length} Konten`+
           (m.kept.length?`, davon ${m.kept.length} beibehalten`:"")+").");
  };

  const applyVorlage = async () => {
    const v = APP_CONFIG.vorlagen.find(x=>x.id===vorlageId); if(!v) return;
    setBusy(true); setMsg(""); setErrs([]);
    try { applyChart(await loadChartTemplate(v), v.label); }
    catch(err){ setErrs([err.message]); }
    setBusy(false);
  };

  const importChart = async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    setMsg(""); setErrs([]);
    try {
      const text = (await f.text()).replace(/^﻿/,"");
      const isJson = /^\s*[\[{]/.test(text);
      const c = normalizeChart(isJson ? JSON.parse(text) : parseChartCsv(text));
      applyChart(c, f.name.replace(/\.[^.]+$/,""));
    } catch(err){ setErrs([`Datei «${f.name}» nicht lesbar: ${err.message}`]); }
  };

  const sorted = () => accounts.slice().sort((a,b)=>a.number.localeCompare(b.number));
  const exportChartJSON = () => {
    const data = { format:"kontenplan", version:1, name:settings.chartName||"Eigener Kontenplan",
                   fxAccounts:settings.fxAccounts, resultAccount:settings.resultAccount||DEFAULT_RESULT_ACCOUNT,
                   exportDate:new Date().toISOString(),
                   accounts: sorted().map(({number,name,category,group,currency})=>
                     ({ number, name, category, group:group||"", ...(currency&&currency!==CHF?{currency}:{}) })) };
    dlFile(JSON.stringify(data,null,2), `${fileBase(settings.name)}_Kontenplan.json`);
  };
  const exportChartCSV = () => {
    const q = (v) => `"${String(v??"").replace(/"/g,'""')}"`;
    const rows = [["Nr","Bezeichnung","Kategorie","Gruppe","Währung"],
                  ...sorted().map(a=>[a.number,a.name,a.category,a.group||"",a.currency||CHF])];
    dlFile(rows.map(r=>r.map(q).join(";")).join("\r\n"), `${fileBase(settings.name)}_Kontenplan.csv`);
  };

  const hint = { fontSize:12, color:"#64748B", lineHeight:1.6 };
  const mono = { fontFamily:"'JetBrains Mono',monospace", fontSize:11.5 };

  return (
    <div style={{maxWidth:820,margin:"0 auto"}}>
      <Card title="Name der Organisation">
        <Field label="Verein / Firma">
          <input type="text" value={settings.name} onChange={e=>setName(e.target.value)} onBlur={fixName}
            placeholder={DEFAULT_ORG_NAME} style={IS}/>
        </Field>
        <div style={{...hint,marginTop:8}}>
          Erscheint in der Kopfzeile, in Bilanz und Erfolgsrechnung (inkl. Word-Export), in den Dateinamen der
          Exporte und im JSON-Backup.
        </div>
      </Card>

      <Card title="Kontenplan-Vorlage">
        <div style={{...hint,marginBottom:10}}>
          Aktueller Kontenplan: <strong>{settings.chartName||"Eigener Kontenplan"}</strong> · {accounts.length} Konten
        </div>
        <div style={{display:"flex",gap:10,alignItems:"end",flexWrap:"wrap"}}>
          <Field label="Vorlage" style={{flex:"1 1 280px"}}>
            <select value={vorlageId} onChange={e=>setVorlageId(e.target.value)} style={IS}>
              {APP_CONFIG.vorlagen.map(v=><option key={v.id} value={v.id}>{v.label}</option>)}
            </select>
          </Field>
          <button onClick={applyVorlage} disabled={busy} style={{...PB,height:38,opacity:busy?.6:1}}>
            {busy?"Lade …":"Vorlage übernehmen"}
          </button>
        </div>
        <div style={{...hint,marginTop:8}}>
          Vorlagen sind JSON-Dateien (<span style={mono}>{APP_CONFIG.vorlagen.map(v=>v.url).join(", ")}</span>) und
          lassen sich in <span style={mono}>config.js</span> über <span style={mono}>APP_CONFIG.kontenplanVorlagen</span> anpassen.
          Konten mit Buchungen, die in der Vorlage fehlen, bleiben erhalten.
          {location.protocol==="file:" && <> Beim Öffnen als Datei (file://) kann der Browser Vorlagen nicht nachladen –
            ausser der eingebauten Vereinsvorlage. Andere Vorlagen dann unten über «Kontenplan importieren» wählen.</>}
        </div>
      </Card>

      <Card title="Kontenplan exportieren / importieren">
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
          <button onClick={exportChartJSON} style={SB}>📥 Export JSON</button>
          <button onClick={exportChartCSV}  style={SB}>📥 Export CSV</button>
          <label style={{...PB,cursor:"pointer",display:"inline-flex",alignItems:"center"}}>
            📤 Kontenplan importieren
            <input type="file" accept=".json,.csv,.txt" onChange={importChart} style={{display:"none"}}/>
          </label>
        </div>
        <div style={hint}>
          Import: Kontenplan-JSON (Format wie Export bzw. <span style={mono}>kontenplaene/*.json</span>), ein JSON-Backup
          (nur die Konten werden übernommen) oder CSV mit Kopfzeile <span style={mono}>Nr;Bezeichnung;Kategorie;Gruppe;Währung</span>.
          Kategorie: <span style={mono}>aktiven</span>, <span style={mono}>passiven</span>, <span style={mono}>ertrag</span> oder <span style={mono}>aufwand</span>;
          Währung nur bei Aktiven/Passiven (leer = CHF). Buchungen werden nicht verändert.
        </div>
      </Card>

      {msg && <div style={{padding:"8px 12px",background:"#F0FDF4",borderRadius:6,color:"#15803D",fontSize:13}}>{msg}</div>}
      {errs.length>0 && (
        <div style={{padding:"8px 12px",background:"#FEF2F2",borderRadius:6,color:"#DC2626",fontSize:12,lineHeight:1.6}}>
          ⚠ Kontenplan nicht übernommen:
          <ul style={{margin:"4px 0 0 18px"}}>
            {errs.slice(0,20).map((e,i)=><li key={i}>{e}</li>)}
            {errs.length>20 && <li>… und {errs.length-20} weitere</li>}
          </ul>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [accounts, setAccounts] = useState(DEFAULT_ACCOUNTS);
  const [entries,  setEntries]  = useState([]);
  const [fxRates,  setFxRates]  = useState({}); // { [Jahr]: { EUR:"0.93", … } } Stichtagskurse per 31.12.
  // Name der Organisation, Name des Kontenplans, Kursdifferenz-Konten { gain:"Nr", loss:"Nr" }
  const [settings, setSettings] = useState({ name:APP_CONFIG.name, chartName:BUILTIN_CHART_NAME,
                                             fxAccounts:{ gain:FX_GAIN_ACCOUNT.number, loss:FX_LOSS_ACCOUNT.number },
                                             resultAccount:DEFAULT_RESULT_ACCOUNT });
  const [tab,      setTab]      = useState("journal");
  const [year,     setYear]     = useState(2025);
  const [loaded,   setLoaded]   = useState(false);
  const [saving,   setSaving]   = useState(false);
  const [startMsg, setStartMsg] = useState("");

  // ── Load from localStorage ────────────────────────────────
  useEffect(()=>{
    let firstRun = true;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        firstRun = false;
        const d = JSON.parse(raw);
        if(d.accounts) setAccounts(d.accounts);
        if(d.entries)  setEntries(withUniqueIds(d.entries));
        if(d.year)     setYear(d.year);
        if(d.fxRates)  setFxRates(d.fxRates);
        if(d.settings) setSettings(p=>({ ...p, ...d.settings }));
      }
    } catch(e) { /* first run */ }
    // Erster Start mit einer anderen Standardvorlage als der eingebauten → nachladen
    const vorlage = APP_CONFIG.vorlagen.find(v=>v.id===APP_CONFIG.defaultVorlage);
    if(firstRun && vorlage && vorlage.id!==BUILTIN_CHART_ID){
      loadChartTemplate(vorlage).then(c=>{
        if(c.errors.length) throw new Error(c.errors.join(" "));
        setAccounts(c.accounts);
        setSettings(p=>({ ...p, chartName:c.name||vorlage.label, fxAccounts:c.fxAccounts||p.fxAccounts,
                                  resultAccount:c.resultAccount||DEFAULT_RESULT_ACCOUNT }));
      }).catch(err=>setStartMsg(err.message+" Es wird der eingebaute Vereins-Kontenrahmen verwendet."))
        .finally(()=>setLoaded(true));
      return;
    }
    setLoaded(true);
  },[]);

  useEffect(()=>{ document.title = settings.name || DEFAULT_ORG_NAME; },[settings.name]);

  // ── Auto-save (debounced 600ms) ───────────────────────────
  useEffect(()=>{
    if(!loaded) return;
    setSaving(true);
    const t = setTimeout(()=>{
      try { localStorage.setItem(STORAGE_KEY,JSON.stringify({accounts,entries,year,fxRates,settings})); }
      catch(e){ console.error("Storage error:",e); }
      setSaving(false);
    },600);
    return ()=>clearTimeout(t);
  },[accounts,entries,year,fxRates,settings,loaded]);

  // ── Account saldo ─────────────────────────────────────────
  const getSaldo = useCallback((num, filterYear=null)=>{
    const acc = accounts.find(a=>a.number===num);
    if(!acc) return 0;
    const ents = filterYear ? entries.filter(e=>e.date.startsWith(String(filterYear))) : entries;
    const d = ents.filter(e=>e.debit===num).reduce((s,e)=>s+Number(e.amount),0);
    const c = ents.filter(e=>e.credit===num).reduce((s,e)=>s+Number(e.amount),0);
    return (acc.category==="aktiven"||acc.category==="aufwand") ? d-c : c-d;
  },[accounts,entries]);

  // ── Saldo in Fremdwährung (0 für CHF-Konten) ─────────────
  const getFxSaldo = useCallback((num, filterYear=null)=>{
    const acc = accounts.find(a=>a.number===num);
    const cur = acc?.currency||CHF;
    if(!acc||cur===CHF) return 0;
    const ents = (filterYear ? entries.filter(e=>e.date.startsWith(String(filterYear))) : entries)
      .filter(e=>e.fxCurrency===cur);
    const d = ents.filter(e=>e.debit===num ).reduce((s,e)=>s+Number(e.fxAmount||0),0);
    const c = ents.filter(e=>e.credit===num).reduce((s,e)=>s+Number(e.fxAmount||0),0);
    return round2(acc.category==="aktiven" ? d-c : c-d);
  },[accounts,entries]);

  const TABS = [
    { id:"journal",   label:"📝 Journal"        },
    { id:"kontenplan",label:"📋 Kontenplan"      },
    { id:"hauptbuch", label:"📖 Hauptbuch"       },
    { id:"bilanz",    label:"⚖️ Bilanz"          },
    { id:"erfolg",    label:"📊 Erfolgsrechnung" },
    { id:"fremdwaehrung", label:"💱 Fremdwährung" },
    { id:"assistent",  label:"🤖 Buchungsassistent" },
    { id:"einstellungen", label:"⚙️ Einstellungen" },
  ];

  if(!loaded) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",
                 height:"100vh",fontFamily:"sans-serif",color:MUTED,fontSize:14}}>
      Lade Buchhaltungsdaten …
    </div>
  );

  return (
    <div style={{fontFamily:"'Outfit',sans-serif",minHeight:"100vh",background:"#F1F5F9"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        *{box-sizing:border-box;}
        .hover-row:hover td{background:rgba(15,36,96,.03)!important;}
        input:focus,select:focus{border-color:#0F2460!important;box-shadow:0 0 0 3px rgba(15,36,96,.1)!important;outline:none;}
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;}
        @media print{
          .no-print{display:none!important;}
          body,#root>div{background:white!important;}
          .hover-row:hover td{background:transparent!important;}
        }
      `}</style>

      {/* ── Header ── */}
      <div className="no-print"
        style={{background:"linear-gradient(135deg,#0F2460 0%,#1a3a80 100%)",
                color:"white",padding:"0 24px",
                boxShadow:"0 2px 12px rgba(15,36,96,.25)"}}>
        <div style={{maxWidth:1200,margin:"0 auto",display:"flex",
                     alignItems:"center",justifyContent:"space-between",height:62}}>
          <div>
            <div style={{fontSize:9.5,letterSpacing:3.5,textTransform:"uppercase",
                         opacity:.5,marginBottom:2}}>
              Doppelte Buchhaltung · {settings.chartName||"Eigener Kontenplan"} · FJ {year}
            </div>
            <div style={{fontSize:21,fontWeight:800,letterSpacing:-.5}}>{settings.name||DEFAULT_ORG_NAME}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            {saving&&<span style={{fontSize:11,opacity:.45,fontStyle:"italic"}}>Speichere…</span>}
            <span style={{fontSize:11,opacity:.55}}>Geschäftsjahr</span>
            <select value={year} onChange={e=>setYear(Number(e.target.value))}
              style={{background:"rgba(255,255,255,.13)",color:"white",
                      border:"1px solid rgba(255,255,255,.3)",borderRadius:7,
                      padding:"5px 12px",fontSize:14,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>
              {[2023,2024,2025,2026,2027].map(y=>(
                <option key={y} value={y} style={{color:"#0F2460",background:"white"}}>{y}</option>
              ))}
            </select>
          </div>
        </div>
      </div>

      {/* ── Tab bar ── */}
      <div className="no-print"
        style={{background:"#0C1D52",borderBottom:"3px solid #F1F5F9"}}>
        <div style={{maxWidth:1200,margin:"0 auto",display:"flex",padding:"0 24px"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              padding:"11px 18px",border:"none",cursor:"pointer",
              fontSize:13,fontWeight:tab===t.id?700:400,
              fontFamily:"inherit",letterSpacing:.1,
              background:tab===t.id?"#F1F5F9":"transparent",
              color:tab===t.id?"#0F2460":"rgba(255,255,255,.6)",
              borderRadius:tab===t.id?"8px 8px 0 0":4,
              transition:"all .15s",
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* ── Content ── */}
      <div style={{maxWidth:1200,margin:"0 auto",padding:24}}>
        {startMsg && (
          <div className="no-print" style={{marginBottom:14,padding:"8px 12px",background:"#FFFBEB",border:"1px solid #FDE68A",
                       borderRadius:6,color:"#92400E",fontSize:12,display:"flex",gap:10,alignItems:"center"}}>
            <span style={{flex:1}}>⚠ {startMsg}</span>
            <button onClick={()=>setStartMsg("")} style={{...SB,padding:"2px 8px"}}>×</button>
          </div>
        )}
        {tab==="journal"    && <JournalTab    accounts={accounts} setAccounts={setAccounts}
                                               entries={entries}   setEntries={setEntries}
                                               fxRates={fxRates}   setFxRates={setFxRates}  year={year}
                                               settings={settings} setSettings={setSettings}/>}
        {tab==="kontenplan" && <KontenplanTab  accounts={accounts} setAccounts={setAccounts}
                                               entries={entries}   getSaldo={getSaldo}
                                               getFxSaldo={getFxSaldo} year={year}/>}
        {tab==="hauptbuch"  && <HauptbuchTab   accounts={accounts} entries={entries}
                                               setEntries={setEntries} year={year}/>}
        {tab==="bilanz"     && <BilanzTab       accounts={accounts} getSaldo={getSaldo}
                                               getFxSaldo={getFxSaldo} fxRates={fxRates}    year={year}
                                               settings={settings}/>}
        {tab==="erfolg"     && <ErfolgsrechnungTab accounts={accounts} getSaldo={getSaldo}    year={year}
                                               settings={settings}/>}
        {tab==="fremdwaehrung" && <FremdwaehrungTab accounts={accounts} setAccounts={setAccounts}
                                               setEntries={setEntries} getSaldo={getSaldo}
                                               getFxSaldo={getFxSaldo} fxRates={fxRates}
                                               setFxRates={setFxRates} year={year} settings={settings}/>}
        {tab==="assistent"  && <AssistentTab accounts={accounts} entries={entries} setEntries={setEntries}
                                               fxRates={fxRates} year={year} settings={settings}/>}
        {tab==="einstellungen" && <EinstellungenTab accounts={accounts} setAccounts={setAccounts}
                                               entries={entries} settings={settings} setSettings={setSettings}/>}
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
