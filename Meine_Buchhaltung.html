const DEFAULT_RESULT_ACCOUNT = "2900";

const CATEGORIES = ["aktiven","passiven","ertrag","aufwand"];
const CATEGORY_ALIASES = { aktiv:"aktiven", aktiva:"aktiven", passiv:"passiven", passiva:"passiven",
                           erträge:"ertrag", ertraege:"ertrag", aufwände:"aufwand", aufwaende:"aufwand" };

// Kontenplan validieren und normalisieren → { accounts, name, fxAccounts, resultAccount, errors:[…] }
// Akzeptiert: Kontenplan-Datei { name, fxAccounts, resultAccount, accounts:[…] }, Buchhaltungs-Backup oder reines Array.
const normalizeChart = (data) => {
  const list = Array.isArray(data) ? data : data?.accounts;
  const errors = [];
  if(!Array.isArray(list) || !list.length) return { accounts:[], errors:["Keine Konten gefunden (Feld «accounts» fehlt oder ist leer)."] };
  const seen = new Set(), accounts = [];
  list.forEach((raw,i)=>{
    const row = `Zeile ${i+1}`;
    const number = String(raw?.number ?? "").trim();
    const name   = String(raw?.name ?? "").trim();
    let category = String(raw?.category ?? "").trim().toLowerCase();
    category = CATEGORY_ALIASES[category] || category;
    const group    = String(raw?.group ?? "").trim();
    const currency = String(raw?.currency ?? "").trim().toUpperCase() || CHF;
    if(!number || !name){ errors.push(`${row}: Kontonummer und Bezeichnung sind Pflicht.`); return; }
    if(seen.has(number)){ errors.push(`${row}: Kontonummer ${number} kommt mehrfach vor.`); return; }
    if(!CATEGORIES.includes(category)){
      errors.push(`${row} (${number}): Kategorie «${raw?.category??""}» ungültig – erlaubt: ${CATEGORIES.join(", ")}.`); return; }
    if(!/^[A-Z]{3}$/.test(currency)){ errors.push(`${row} (${number}): Währung «${currency}» ist kein ISO-Code.`); return; }
    if(currency!==CHF && category!=="aktiven" && category!=="passiven"){
      errors.push(`${row} (${number}): Fremdwährung nur für Aktiven/Passiven erlaubt.`); return; }
    seen.add(number);
    const acc = { number, name, category, group };
    if(currency!==CHF) acc.currency = currency;
    accounts.push(acc);
  });
  accounts.sort((a,b)=>a.number.localeCompare(b.number));
  // Kontenplan-Datei: «name» = Name des Kontenplans · Backup: «name» = Organisation, «kontenplan» = Plan
  const isBackup = Array.isArray(data?.entries);
  const name = typeof data?.kontenplan==="string" ? data.kontenplan.trim()
             : !isBackup && typeof data?.name==="string" ? data.name.trim() : "";
  const resultAccount = String(data?.resultAccount ?? "").trim() || null;
  return { accounts, name, fxAccounts: data?.fxAccounts || null, resultAccount, errors };
};

// Kontenplan aus CSV: Nr;Bezeichnung;Kategorie;Gruppe;Währung (Kopfzeile, Trennzeichen ; , oder Tab)
const parseChartCsv = (text) => {
  const lines = text.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) throw new Error("CSV enthält keine Konten.");
  const sep = [";","\t",","].find(s=>lines[0].includes(s)) || ";";
  const split = (l) => { const out=[]; let cur="", q=false;
    for(let i=0;i<l.length;i++){ const ch=l[i];
      if(q){ if(ch==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else if(ch==='"') q=true; else if(ch===sep){ out.push(cur); cur=""; } else cur+=ch; }
    out.push(cur); return out.map(s=>s.trim()); };
  const head = split(lines[0]).map(h=>h.toLowerCase());
  const col = (...names) => head.findIndex(h=>names.some(n=>h===n||h.startsWith(n)));
  const c = { number:col("nr","konto","number","kontonummer"), name:col("bezeichnung","name","kontoname"),
              category:col("kategorie","category","typ"), group:col("gruppe","group"),
              currency:col("währung","waehrung","currency") };
  if(c.number<0||c.name<0||c.category<0)
    throw new Error("CSV-Kopfzeile braucht mindestens die Spalten Nr, Bezeichnung und Kategorie.");
  return lines.slice(1).map(l=>{ const v = split(l);
    return { number:v[c.number], name:v[c.name], category:v[c.category],
             group: c.group>=0 ? v[c.group] : "", currency: c.currency>=0 ? v[c.currency] : "" }; });
};

// Vorlage laden (fetch). Die eingebaute Vereinsvorlage dient als Fallback, wenn fetch scheitert (file://).
const loadChartTemplate = async (vorlage) => {
  try {
    const res = await fetch(vorlage.url, { cache:"no-cache" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return normalizeChart(await res.json());
  } catch(err) {
    if(vorlage.id===BUILTIN_CHART_ID)
      return { accounts:DEFAULT_ACCOUNTS, name:BUILTIN_CHART_NAME, fxAccounts:{ gain:"3450", loss:"6700" }, resultAccount:DEFAULT_RESULT_ACCOUNT, errors:[] };
    throw new Error(`Vorlage «${vorlage.label}» konnte nicht geladen werden (${vorlage.url}: ${err.message}). `+
      (location.protocol==="file:" ? "Beim Öffnen als Datei (file://) blockiert der Browser das Nachladen – "+
        "die Datei stattdessen über «Kontenplan importieren» wählen oder die Seite über einen Webserver öffnen." : ""));
  }
};

// Neuen Kontenplan mit bestehenden Buchungen abgleichen:
//  – Konten mit Buchungen, die im neuen Plan fehlen, werden beibehalten
//  – Währungswechsel eines bebuchten Kontos ist nicht erlaubt
const mergeChartWithEntries = (newAccounts, oldAccounts, entries) => {
  const used = new Set(entries.flatMap(e=>[e.debit,e.credit]));
  const byNum = new Map(newAccounts.map(a=>[a.number,a]));
  const kept = [], errors = [], changedCat = [];
  for(const old of oldAccounts){
    if(!used.has(old.number)) continue;
    const n = byNum.get(old.number);
    if(!n){ kept.push(old); continue; }
    if((n.currency||CHF)!==(old.currency||CHF))
      errors.push(`Konto ${old.number}: Währung ${old.currency||CHF} → ${n.currency||CHF} nicht möglich (Konto hat Buchungen).`);
    if(n.category!==old.category) changedCat.push(`${old.number} (${old.category} → ${n.category})`);
  }
  // Konten, die in Buchungen vorkommen, aber gar nicht im alten Plan waren, bleiben unverändert verwaist
  return { accounts:[...newAccounts, ...kept].sort((a,b)=>a.number.localeCompare(b.number)), kept, errors, changedCat };
};

// ── Fremdwährungen ──────────────────────────────────────────────
// Buchwährung ist CHF (OR 957a Abs. 4). Fremdwährungskonten (nur Aktiven/Passiven)
// führen zusätzlich den Betrag in Originalwährung. Jede Buchung wird zum
// Transaktionskurs in CHF umgerechnet; per Bilanzstichtag werden die Salden zum
// Stichtagskurs bewertet (Bewertungsbuchungen ohne Fremdwährungsbetrag).
const CHF = "CHF";
const COMMON_CURRENCIES = ["EUR","USD","GBP","JPY","SEK","NOK","DKK","CAD","AUD","CNY","PLN","CZK","HUF"];

const fmtRate = (n) =>
  new Intl.NumberFormat("de-CH", { minimumFractionDigits:4, maximumFractionDigits:6 }).format(n||0);
const parseNum = (v) => {
  if(v===null||v===undefined||v==="") return NaN;
  return parseFloat(String(v).replace(/['’\s]/g,"").replace(",","."));
};
const round2 = (n) => Math.round((n+Number.EPSILON)*100)/100;
const accCurrency = (accounts, num) => accounts.find(a=>a.number===num)?.currency || CHF;

// Fremdwährung einer Buchung ermitteln (currency:null = reine CHF-Buchung)
const entryFxCurrency = (accounts, debit, credit) => {
  const cd = accCurrency(accounts,debit), cc = accCurrency(accounts,credit);
  if(cd!==CHF && cc!==CHF && cd!==cc)
    return { error:`Soll (${cd}) und Haben (${cc}) haben verschiedene Fremdwährungen – `+
                   `bitte in zwei Buchungen über ein CHF-Konto erfassen.` };
  return { currency: cd!==CHF ? cd : (cc!==CHF ? cc : null) };
};

// Formular-Update mit gegenseitiger Neuberechnung von CHF-Betrag und Kurs
const fxFormUpdate = (prev, k, v) => {
  const next = { ...prev, [k]:v };
  const fx = parseNum(next.fxAmount), rate = parseNum(next.fxRate), amt = parseNum(next.amount);
  if((k==="fxAmount"||k==="fxRate") && fx>0 && rate>0) next.amount = round2(fx*rate).toFixed(2);
  if(k==="amount" && fx>0 && amt>0) next.fxRate = String(+(amt/fx).toFixed(6));
  return next;
};

// Buchung validieren und normalisieren → { entry } oder { error }
const normalizeEntry = (raw, accounts) => {
  if(!raw.date||!raw.description||!raw.debit||!raw.credit||raw.amount===""||raw.amount==null)
    return { error:"Pflichtfelder: Datum, Text, Soll, Haben, Betrag." };
  if(raw.debit===raw.credit) return { error:"Soll ≠ Haben." };
  const amt = round2(parseNum(raw.amount));
  if(isNaN(amt)||amt<=0) return { error:"Betrag CHF muss > 0 sein." };
  const { currency, error } = entryFxCurrency(accounts, raw.debit, raw.credit);
  if(error) return { error };
  const base = { id:raw.id, date:raw.date, description:raw.description, reference:raw.reference||"",
                 debit:raw.debit, credit:raw.credit, amount:amt };
  // Herkunft aus dem Kontoauszug-Import (Duplikaterkennung, Lernen der Gegenkonten)
  for(const k of ["importId","bankCp","bankIban","bankKey"]) if(raw[k]) base[k] = raw[k];
  if(!currency) return { entry:base };
  if(raw.fxReval) return { entry:{ ...base, fxCurrency:currency, fxAmount:0, fxReval:true } };
  const fx = round2(parseNum(raw.fxAmount));
  if(isNaN(fx)||fx<=0)
    return { error:`Betrag ${currency} muss > 0 sein (oder Buchung als Kursdifferenz markieren).` };
  return { entry:{ ...base, fxCurrency:currency, fxAmount:fx, fxRate:+(amt/fx).toFixed(6) } };
};

// Nächste freie Belegnummer im Format «<Jahr>-NNN» (Jahr aus dem Buchungsdatum).
// Gezählt werden nur Nummern genau dieses Formats; andere (z. B. «FW-BEW-2026»,
// Fremdbelegnummern) bleiben unberücksichtigt. extra = bereits vergebene, noch nicht gebuchte.
const nextReference = (entries, date, extra=[]) => {
  const y  = /^\d{4}/.test(date||"") ? date.slice(0,4) : String(new Date().getFullYear());
  const re = new RegExp(`^${y}-(\\d+)$`);
  const max = [...entries.map(e=>e.reference), ...extra].reduce((m,r)=>{
    const hit = re.exec(String(r||"").trim());
    return hit ? Math.max(m, parseInt(hit[1],10)) : m;
  }, 0);
  return `${y}-${String(max+1).padStart(3,"0")}`;
};

// Stichtagsbewertung aller Fremdwährungskonten
//  – Verluste werden immer gebucht (Vorsichtsprinzip, OR 960 Abs. 2)
//  – Gewinne standardmässig nur auf flüssigen Mitteln / kurzfristigen Wertschriften
//    (Konten 10xx, beobachtbarer Marktpreis OR 960b); auf Forderungen und
//    Verbindlichkeiten bleiben unrealisierte Gewinne unberücksichtigt (Imparitätsprinzip)
//  – Eigenkapitalkonten (Gruppe «Eigenkapital…», z. B. Privat EUR) werden nicht bewertet:
//    Eigenkapital ist eine Restgrösse, keine Forderung oder Schuld in Fremdwährung
const isEquityAccount = (a) => a.category==="passiven" && /^\s*eigenkapital/i.test(a.group||"");
const fxAccountsOf = (accounts) =>
  accounts.filter(a=>(a.currency||CHF)!==CHF && (a.category==="aktiven"||a.category==="passiven"));
const computeFxValuation = ({ accounts, getSaldo, getFxSaldo, rates, year }) =>
  fxAccountsOf(accounts)
    .filter(a=>!isEquityAccount(a))
    .slice().sort((a,b)=>a.number.localeCompare(b.number))
    .map(a=>{
      const fxSaldo = getFxSaldo(a.number,year);
      const book    = round2(getSaldo(a.number,year));
      const r       = parseNum(rates?.[a.currency]);
      const rate    = r>0 ? r : null;
      const target  = rate ? round2(fxSaldo*rate) : null;
      const diff    = rate ? round2(target-book) : null;
      const isGain  = !!diff && (a.category==="aktiven" ? diff>0 : diff<0);
      const gainAllowed = a.category==="aktiven" && a.number.startsWith("10");
      return { account:a, fxSaldo, book, rate, target, diff, isGain, gainAllowed,
               defaultBook: !!diff && (!isGain || gainAllowed) };
    });

// Eindeutige Buchungs-IDs: streng monoton, auch bei mehreren Aufrufen in derselben Millisekunde
let lastEntryId = 0;
const newEntryId = () => (lastEntryId = Math.max(Date.now(), lastEntryId+1));

// Doppelte oder fehlende IDs (z. B. aus älteren Daten) durch neue, eindeutige ersetzen
const withUniqueIds = (entries) => {
  const all  = new Set(entries.map(e=>e.id));
  const seen = new Set();
  return entries.map(e=>{
    if(e.id!=null && !seen.has(e.id)){ seen.add(e.id); return e; }
    let id; do { id = newEntryId(); } while(all.has(id));
    all.add(id); seen.add(id);
    return { ...e, id };
  });
};

const makeRevalEntry = (row, gainAcc, lossAcc, year, idx) => {
  const a = row.account;
  const increase   = row.diff>0;                       // CHF-Saldo (Normalsicht) steigt
  const accOnDebit = a.category==="aktiven" ? increase : !increase;
  const counter    = row.isGain ? gainAcc : lossAcc;
  return {
    id: newEntryId(),
    date: `${year}-12-31`,
    description: `Fremdwährungsbewertung ${a.currency} ${fmt(row.fxSaldo)} @ ${fmtRate(row.rate)} (Kurs${row.isGain?"gewinn":"verlust"})`,
    reference: `FW-BEW-${year}`,
    debit:  accOnDebit ? a.number : counter,
    credit: accOnDebit ? counter  : a.number,
    amount: Math.abs(row.diff),
    fxCurrency: a.currency, fxAmount: 0, fxReval: true,
  };
};

// Real file download for standalone HTML
const dlFile = (content, filename) => {
  const bom = "\uFEFF";
  const blob = new Blob([bom + content], { type: "text/plain;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

function JournalTab({ accounts, setAccounts, entries, setEntries, fxRates, setFxRates, year, settings, setSettings }) {
  const blank = { date:`${year}-01-01`, description:"", debit:"", credit:"", amount:"", reference:"",
                  refAuto:true, fxAmount:"", fxRate:"", fxReval:false };
  const [form,    setForm]    = useState(blank);
  const [error,   setError]   = useState("");
  const [filterY, setFilterY] = useState(true);
  const [sort,    setSort]    = useState({ key:"date", dir:"desc" });
  const [editing, setEditing] = useState(null); // {id, date, description, reference, debit, credit, amount}
  const [editErr, setEditErr] = useState("");
  const blankFilter = { date:"", reference:"", description:"", debit:"", credit:"", amount:"" };
  const [searchOpen, setSearchOpen] = useState(false);
  const [colFilter,  setColFilter]  = useState(blankFilter);
  const filterActive = Object.values(colFilter).some(v=>v.trim());
  const toggleSearch = () => { if(searchOpen) setColFilter(blankFilter); setSearchOpen(o=>!o); };

  const f = (k,v) => setForm(p=>fxFormUpdate(p,k,v));

  const startEdit = (e) => setEditing({ ...e, amount: String(e.amount),
    fxAmount: e.fxAmount ? String(e.fxAmount) : "", fxRate: e.fxRate ? String(e.fxRate) : "",
    fxReval: !!e.fxReval });
  const cancelEdit = () => { setEditing(null); setEditErr(""); };
  const saveEdit = () => {
    const { entry, error } = normalizeEntry(editing, accounts);
    if(error){ setEditErr(error); return; }
    setEntries(p=>p.map(e=>e.id===editing.id?entry:e));
    setEditing(null); setEditErr("");
  };
  const ef = (k,v) => setEditing(p=>fxFormUpdate(p,k,v));

  const visible = useMemo(()=>{
    let arr = filterY ? entries.filter(e=>e.date.startsWith(String(year))) : [...entries];
    // Spaltenfilter (Suche): Text = enthält, Gross-/Kleinschreibung egal
    const norm = s => String(s||"").toLowerCase();
    const has  = (hay, q) => norm(hay).includes(norm(q).trim());
    const accLabel = n => `${n} ${accounts.find(a=>a.number===n)?.name||""}`;
    const dateCH = d => { const [y,m,dd] = String(d).split("-"); return `${dd}.${m}.${y}`; };
    // Betrag: «>100», «<=50», «=20» oder «100-200» als Vergleich, sonst Textsuche
    const amountMatch = (amt, q) => {
      const s = q.trim().replace(/\s/g,""); if(!s) return true;
      const a = Number(amt);
      const range = s.match(/^([\d.,']+)-([\d.,']+)$/);
      if(range) return a>=parseNum(range[1]) && a<=parseNum(range[2]);
      const op = s.match(/^(>=|<=|>|<|=)(.+)$/);
      if(op){
        const n = parseNum(op[2]); if(isNaN(n)) return true;
        return { ">=":a>=n, "<=":a<=n, ">":a>n, "<":a<n, "=":Math.abs(a-n)<0.005 }[op[1]];
      }
      return a.toFixed(2).includes(s.replace(",",".")) || has(fmt(a), s);
    };
    const F = colFilter;
    if(Object.values(F).some(v=>v.trim())) arr = arr.filter(e =>
      (!F.date.trim()        || has(e.date,F.date) || has(dateCH(e.date),F.date)) &&
      (!F.reference.trim()   || has(e.reference,F.reference)) &&
      (!F.description.trim() || has(e.description,F.description)) &&
      (!F.debit.trim()       || has(accLabel(e.debit),F.debit)) &&
      (!F.credit.trim()      || has(accLabel(e.credit),F.credit)) &&
      amountMatch(e.amount, F.amount));
    const txt = (x,y) => String(x||"").localeCompare(String(y||""),"de",{numeric:true,sensitivity:"base"});
    const cmp = {
      date:        (a,b) => a.date.localeCompare(b.date),
      reference:   (a,b) => txt(a.reference,b.reference),
      description: (a,b) => txt(a.description,b.description),
      debit:       (a,b) => txt(a.debit,b.debit),
      credit:      (a,b) => txt(a.credit,b.credit),
      amount:      (a,b) => Number(a.amount)-Number(b.amount),
    }[sort.key];
    const sign = sort.dir==="desc" ? -1 : 1;
    // Bei Gleichstand nach Datum, dann Erfassungsreihenfolge
    return arr.sort((a,b)=> sign*(cmp(a,b) || a.date.localeCompare(b.date) || a.id-b.id));
  },[entries,year,filterY,sort,colFilter,accounts]);

  const toggleSort = (key) => setSort(p => p.key===key
    ? { key, dir: p.dir==="asc" ? "desc" : "asc" }
    : { key, dir: key==="date"||key==="amount" ? "desc" : "asc" });
  const SortTh = ({ k, children, align }) => (
    <Th align={align} onClick={()=>toggleSort(k)} title="Klicken zum Sortieren"
        style={{cursor:"pointer",userSelect:"none", ...(sort.key===k ? {color:"#1E293B"} : {})}}>
      {children}
      <span style={{marginLeft:4,opacity:sort.key===k?1:.3}}>
        {sort.key===k ? (sort.dir==="asc" ? "▲" : "▼") : "↕"}
      </span>
    </Th>
  );

  // Belegnummer automatisch vorbelegen, solange sie nicht von Hand geändert wurde
  const formRef = form.refAuto ? nextReference(entries, form.date) : form.reference;

  const add = () => {
    const { entry, error } = normalizeEntry({ ...form, reference:formRef }, accounts);
    if(error){ setError(error); return; }
    setEntries(p=>[...p,{ ...entry, id:newEntryId() }]);
    setForm(p=>({...p, description:"", amount:"", reference:"", refAuto:true, fxAmount:"", fxReval:false}));
    setError("");
  };

  const [confirmDel, setConfirmDel] = useState(null);
  const del = (id) => setConfirmDel(id);
  const confirmDelete = () => { setEntries(p=>p.filter(e=>e.id!==confirmDel)); setConfirmDel(null); setEditing(null); };

  const exportCSV = () => {
    const h = ["Datum","Belegnr.","Buchungstext","Soll-Nr.","Soll-Konto","Haben-Nr.","Haben-Konto","Betrag CHF",
               "Währung","Betrag FW","Kurs"];
    const rows = visible.map(e=>[
      e.date, e.reference||"", e.description,
      e.debit, accounts.find(a=>a.number===e.debit)?.name||"",
      e.credit, accounts.find(a=>a.number===e.credit)?.name||"",
      Number(e.amount).toFixed(2).replace(".",","),
      e.fxCurrency||"",
      e.fxCurrency ? (e.fxReval ? "Kursdifferenz" : Number(e.fxAmount).toFixed(2).replace(".",",")) : "",
      e.fxCurrency && !e.fxReval ? String(e.fxRate).replace(".",",") : "",
    ]);
    dlFile([h,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n"),
      `${fileBase(settings.name)}_Journal_${year}.csv`);
  };

  const exportJSON = () => {
    dlFile(JSON.stringify({ name:settings.name, kontenplan:settings.chartName, fxAccounts:settings.fxAccounts, resultAccount:settings.resultAccount,
      exportDate:new Date().toISOString(), year, accounts, entries, fxRates },null,2),
      `${fileBase(settings.name)}_Backup_${new Date().toISOString().slice(0,10)}.json`);
  };

  const importJSON = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.accounts) setAccounts(d.accounts);
        if(d.entries)  setEntries(withUniqueIds(d.entries));
        setFxRates(d.fxRates||{});
        // Name der Organisation (ältere Backups: Feld «verein»), Kontenplan-Name, Kursdifferenz-Konten
        const name = String(d.name ?? d.verein ?? "").trim();
        setSettings(p=>({ ...p,
          ...(name ? { name } : {}),
          ...(typeof d.kontenplan==="string" ? { chartName:d.kontenplan } : {}),
          ...(d.fxAccounts ? { fxAccounts:d.fxAccounts } : {}),
          ...(d.resultAccount ? { resultAccount:String(d.resultAccount) } : {}) }));
        alert(`✓ Backup${name?` «${name}»`:""} importiert!`);
      } catch { alert("Fehler: Ungültige JSON-Datei."); }
    };
    r.readAsText(file); e.target.value="";
  };

  const total = visible.reduce((s,e)=>s+Number(e.amount),0);
  const accName = (n) => accounts.find(a=>a.number===n)?.name||"";

  return (
    <div>
      <Card title="Neue Buchung erfassen">
        <div style={{ display:"grid", gridTemplateColumns:"150px 1fr 130px 120px", gap:10 }}>
          <Field label="Datum *">
            <input type="date" value={form.date} onChange={e=>f("date",e.target.value)} style={IS} />
          </Field>
          <Field label="Buchungstext *">
            <input type="text" value={form.description}
              onChange={e=>f("description",e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&add()}
              placeholder="z. B. Mitgliederbeitrag Meyer" style={IS} />
          </Field>
          <Field label="Belegnummer">
            <input type="text" value={formRef}
              onChange={e=>setForm(p=>({...p, reference:e.target.value, refAuto:false}))}
              title={form.refAuto ? "Automatisch: nächste freie Belegnummer" : "Manuell gesetzt"}
              placeholder="2026-001" style={{...IS, color: form.refAuto ? "#64748B" : undefined}} />
          </Field>
          <Field label="Betrag CHF *">
            <input type="number" step="0.05" min="0.01" value={form.amount}
              onChange={e=>f("amount",e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&add()}
              placeholder="0.00"
              style={{...IS,fontFamily:"'JetBrains Mono',monospace",textAlign:"right"}} />
          </Field>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr auto 1fr auto", gap:10, marginTop:10, alignItems:"end" }}>
          <Field label="Soll (Debit) *">
            <AccountSelect accounts={accounts} value={form.debit} onChange={v=>f("debit",v)} />
          </Field>
          <SwapAccountsButton onClick={()=>setForm(swapAccounts)} height={38}/>
          <Field label="Haben (Kredit) *">
            <AccountSelect accounts={accounts} value={form.credit} onChange={v=>f("credit",v)} />
          </Field>
          <button onClick={add} style={{...PB,height:38}}>+ Buchen</button>
        </div>
        <FxInputs accounts={accounts} value={form} onChange={f}/>
        {error && (
          <div style={{color:"#DC2626",marginTop:8,fontSize:12,padding:"6px 10px",
                       background:"#FEF2F2",borderRadius:5}}>⚠ {error}</div>
        )}
      </Card>

      {/* Action bar */}
      <div className="no-print" style={{display:"flex",gap:10,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:"#555",cursor:"pointer"}}>
          <input type="checkbox" checked={filterY} onChange={e=>setFilterY(e.target.checked)}/>
          Nur {year}
        </label>
        <div style={{flex:1}}/>
        <span style={{fontSize:12,color:MUTED}}>{visible.length} Buchungen</span>
        <button onClick={exportCSV} style={SB}>📥 CSV Export</button>
        <button onClick={exportJSON} style={SB}>💾 JSON Backup</button>
        <label style={{...SB,cursor:"pointer",display:"inline-flex",alignItems:"center"}}>
          📤 Restore
          <input type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>
        </label>
      </div>

      {/* Table */}
      <div style={{background:"white",borderRadius:10,border:"1px solid #E2E8F0",
                   overflow:"auto",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            {searchOpen && (
              <tr className="no-print">
                {[["date","Datum / TT.MM.JJJJ"],["reference","Belegnr."],["description","Buchungstext"],
                  ["debit","Nr. oder Name"],["credit","Nr. oder Name"],["amount","z. B. >100, 50-200"]]
                  .map(([k,ph],i)=>(
                  <th key={k} style={{padding:"6px 6px 4px",background:"#F1F5F9",borderBottom:"1px solid #E2E8F0"}}>
                    <input type="text" value={colFilter[k]} placeholder={ph}
                      autoFocus={i===2}
                      onChange={ev=>setColFilter(p=>({...p,[k]:ev.target.value}))}
                      onKeyDown={ev=>{ if(ev.key==="Escape") setColFilter(p=>({...p,[k]:""})); }}
                      style={{...IS,padding:"4px 7px",fontSize:12,fontWeight:400,
                              ...(k==="amount"?{textAlign:"right",fontFamily:"'JetBrains Mono',monospace"}:{}),
                              ...(colFilter[k].trim()?{borderColor:"#0F2460",background:"#EFF6FF"}:{})}}/>
                  </th>
                ))}
                <th style={{padding:"6px 6px 4px",background:"#F1F5F9",borderBottom:"1px solid #E2E8F0",
                            textAlign:"right"}}>
                  <button onClick={()=>setColFilter(blankFilter)} disabled={!filterActive}
                    title="Alle Filter zurücksetzen"
                    style={{...SB,padding:"4px 8px",fontSize:12,opacity:filterActive?1:.4,
                            cursor:filterActive?"pointer":"default"}}>✕</button>
                </th>
              </tr>
            )}
            <tr>
              <SortTh k="date">Datum</SortTh>
              <SortTh k="reference">Belegnr.</SortTh>
              <SortTh k="description">Buchungstext</SortTh>
              <SortTh k="debit">Soll</SortTh>
              <SortTh k="credit">Haben</SortTh>
              <SortTh k="amount" align="right">Betrag CHF</SortTh>
              <Th className="no-print" align="right">
                <button onClick={toggleSearch}
                  title={searchOpen ? "Suche schliessen (Filter zurücksetzen)" : "Buchungen suchen / filtern"}
                  style={{background:searchOpen||filterActive?"#E0E7FF":"none",border:"none",borderRadius:5,
                          cursor:"pointer",fontSize:13,lineHeight:1,padding:"3px 6px",
                          color:searchOpen?"#0F2460":"#64748B"}}>🔍</button>
              </Th>
            </tr>
          </thead>
          <tbody>
            {visible.length===0 ? (
              <tr><td colSpan={7} style={{padding:36,textAlign:"center",color:MUTED,fontStyle:"italic"}}>
                {filterActive
                  ? "Keine Buchungen entsprechen dem Filter."
                  : "Noch keine Buchungen — erfasse deine erste Buchung oben."}
              </td></tr>
            ) : visible.map(e=>{
              const isEditing = editing?.id===e.id;
              if(isEditing) return (
                <tr key={e.id} style={{background:"#FEFCE8",outline:"2px solid #F59E0B",outlineOffset:"-2px"}}>
                  <Td>
                    <input type="date" value={editing.date} onChange={ev=>ef("date",ev.target.value)}
                      style={{...IS,padding:"4px 6px",fontSize:12,width:130,borderColor:"#F59E0B"}}/>
                  </Td>
                  <Td>
                    <input type="text" value={editing.reference} onChange={ev=>ef("reference",ev.target.value)}
                      placeholder="—" style={{...IS,padding:"4px 6px",fontSize:12,width:90,borderColor:"#F59E0B"}}/>
                  </Td>
                  <Td>
                    <input type="text" value={editing.description} onChange={ev=>ef("description",ev.target.value)}
                      onKeyDown={ev=>{if(ev.key==="Enter")saveEdit();if(ev.key==="Escape")cancelEdit();}}
                      autoFocus style={{...IS,padding:"4px 6px",fontSize:13,borderColor:"#F59E0B",
                                       boxShadow:"0 0 0 3px rgba(245,158,11,.15)"}}/>
                  </Td>
                  <Td>
                    <div style={{display:"flex",gap:4,alignItems:"center"}}>
                      <div style={{flex:1,minWidth:0}}>
                        <AccountSelect accounts={accounts} value={editing.debit} onChange={v=>ef("debit",v)}/>
                      </div>
                      <SwapAccountsButton onClick={()=>setEditing(swapAccounts)}/>
                    </div>
                  </Td>
                  <Td>
                    <AccountSelect accounts={accounts} value={editing.credit} onChange={v=>ef("credit",v)}/>
                  </Td>
                  <Td align="right">
                    <input type="number" step="0.05" value={editing.amount} onChange={ev=>ef("amount",ev.target.value)}
                      onKeyDown={ev=>{if(ev.key==="Enter")saveEdit();if(ev.key==="Escape")cancelEdit();}}
                      style={{...IS,padding:"4px 6px",fontFamily:"'JetBrains Mono',monospace",
                              textAlign:"right",fontSize:13,width:110,borderColor:"#F59E0B"}}/>
                    <FxInputs accounts={accounts} value={editing} onChange={ef} compact/>
                  </Td>
                  <Td className="no-print" align="right">
                    <div style={{display:"flex",gap:4,justifyContent:"flex-end",flexWrap:"wrap"}}>
                      {editErr&&<span style={{fontSize:10,color:"#DC2626",width:"100%",textAlign:"right"}}>{editErr}</span>}
                      <button onClick={saveEdit}
                        style={{...PB,padding:"4px 10px",fontSize:12,background:"#16A34A"}}
                        title="Speichern (Enter)">✓</button>
                      <button onClick={cancelEdit}
                        style={{...SB,padding:"4px 10px",fontSize:12}}
                        title="Abbrechen (Esc)">✕</button>
                      {confirmDel!==e.id
                        ? <button onClick={()=>del(e.id)}
                            style={{...SB,padding:"4px 10px",fontSize:12,borderColor:"#FECACA",color:"#EF4444"}}
                            title="Buchung löschen">🗑</button>
                        : <>
                            <span style={{fontSize:10,color:"#DC2626",alignSelf:"center",fontWeight:600}}>Sicher?</span>
                            <button onClick={confirmDelete} style={{...PB,padding:"4px 8px",fontSize:11,background:"#DC2626"}}>Ja</button>
                            <button onClick={()=>setConfirmDel(null)} style={{...SB,padding:"4px 8px",fontSize:11}}>Nein</button>
                          </>
                      }
                    </div>
                  </Td>
                </tr>
              );
              return (
              <tr key={e.id} className="hover-row">
                <Td style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:"#475569"}}>{e.date}</Td>
                <Td style={{color:MUTED,fontSize:12}}>{e.reference||"—"}</Td>
                <Td>{e.description}</Td>
                <Td>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,
                                fontWeight:700,color:"#1D4ED8"}}>{e.debit}</span>
                  <span style={{color:MUTED,fontSize:11,marginLeft:5}}>{accName(e.debit)}</span>
                </Td>
                <Td>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,
                                fontWeight:700,color:"#059669"}}>{e.credit}</span>
                  <span style={{color:MUTED,fontSize:11,marginLeft:5}}>{accName(e.credit)}</span>
                </Td>
                <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:500}}>
                  {fmt(e.amount)}<FxAmountNote e={e}/>
                </Td>
                <Td className="no-print" align="right">
                  <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}>
                    <button onClick={()=>startEdit(e)}
                      style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",
                              fontSize:14,lineHeight:1,transition:"color .15s",padding:"2px 4px"}}
                      onMouseEnter={ev=>ev.currentTarget.style.color="#F59E0B"}
                      onMouseLeave={ev=>ev.currentTarget.style.color="#CBD5E1"}
                      title="Bearbeiten">✏</button>
                    {confirmDel!==e.id
                      ? <button onClick={()=>del(e.id)}
                          style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",
                                  fontSize:16,lineHeight:1,transition:"color .15s",padding:"2px 4px"}}
                          onMouseEnter={ev=>ev.target.style.color="#EF4444"}
                          onMouseLeave={ev=>ev.target.style.color="#CBD5E1"}
                          title="Löschen">×</button>
                      : <div style={{display:"flex",gap:3,alignItems:"center"}}>
                          <span style={{fontSize:10,color:"#DC2626",fontWeight:600}}>Sicher?</span>
                          <button onClick={confirmDelete} style={{...PB,padding:"2px 7px",fontSize:11,background:"#DC2626"}}>Ja</button>
                          <button onClick={()=>setConfirmDel(null)} style={{...SB,padding:"2px 7px",fontSize:11}}>Nein</button>
                        </div>
                    }
                  </div>
                </Td>
              </tr>
              );
            })}
          </tbody>
          {visible.length>0 && (
            <tfoot>
              <tr style={{background:"#F8FAFC"}}>
                <td colSpan={5} style={{padding:"10px 12px",fontWeight:700,fontSize:13,
                                        borderTop:"2px solid #E2E8F0"}}>
                  Total {filterY?year:"alle"}{filterActive?", gefiltert":""} ({visible.length} Buchungen)
                </td>
                <td style={{padding:"10px 12px",textAlign:"right",
                             fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:14,
                             borderTop:"2px solid #E2E8F0",color:"#0F172A"}}>
                  {fmt(total)}
                </td>
                <td className="no-print" style={{borderTop:"2px solid #E2E8F0"}}/>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

// TAB: KONTENPLAN
// ═══════════════════════════════════════════════════════════════
function KontenplanTab({ accounts, setAccounts, entries, getSaldo, getFxSaldo, year }) {
  const blankAcc = {number:"",name:"",category:"aktiven",group:"",currency:CHF};
  const [form,    setForm]    = useState(blankAcc);
  const [error,   setError]   = useState("");
  const [open,    setOpen]    = useState(false);
  const [editing, setEditing] = useState(null); // { number, name, group }
  const [editErr, setEditErr] = useState("");
  const [confirmDel, setConfirmDel] = useState(null); // account number pending deletion

  const f = (k,v) => setForm(p=>({...p,[k]:v}));

  // Fremdwährung nur für Bilanzkonten – Aufwand/Ertrag wird immer in CHF geführt
  const fxAllowed = (cat) => cat==="aktiven"||cat==="passiven";
  const cleanCur  = (c) => (c||CHF).trim().toUpperCase();
  const curError  = (c) => /^[A-Z]{3}$/.test(c) ? "" : "Währung als ISO-Code mit 3 Buchstaben angeben (z. B. EUR).";

  const addAccount = () => {
    if(!form.number.trim()||!form.name.trim()){ setError("Kontonummer und Name sind Pflicht."); return; }
    if(accounts.find(a=>a.number===form.number.trim())){
      setError(`Kontonummer ${form.number} existiert bereits.`); return; }
    const currency = fxAllowed(form.category) ? cleanCur(form.currency) : CHF;
    const ce = curError(currency); if(ce){ setError(ce); return; }
    const acc = {...form,number:form.number.trim(),name:form.name.trim()};
    if(currency===CHF) delete acc.currency; else acc.currency = currency;
    setAccounts(p=>[...p,acc].sort((a,b)=>a.number.localeCompare(b.number)));
    setForm(blankAcc);
    setError(""); setOpen(false);
  };

  const delAccount = (n) => {
    if(window.confirm(`Konto ${n} löschen? Buchungen bleiben erhalten.`))
      setAccounts(p=>p.filter(a=>a.number!==n));
  };

  const startEdit = (a) => {
    setEditing({ number:a.number, name:a.name, group:a.group||"", currency:a.currency||CHF });
    setEditErr("");
  };

  const saveEdit = () => {
    if(!editing.name.trim()){ setEditErr("Bezeichnung darf nicht leer sein."); return; }
    const orig = accounts.find(a=>a.number===editing.number);
    const currency = fxAllowed(orig.category) ? cleanCur(editing.currency) : CHF;
    const ce = curError(currency); if(ce){ setEditErr(ce); return; }
    if(currency!==(orig.currency||CHF) && hasBookings(orig.number)){
      setEditErr("Die Währung kann nur bei Konten ohne Buchungen geändert werden."); return; }
    setAccounts(p => p.map(a => {
      if(a.number!==editing.number) return a;
      const n = { ...a, name:editing.name.trim(), group:editing.group.trim() };
      if(currency===CHF) delete n.currency; else n.currency = currency;
      return n;
    }));
    setEditing(null); setEditErr("");
  };

  const cancelEdit = () => { setEditing(null); setEditErr(""); };

  const hasBookings = (num) => entries.some(e=>e.debit===num||e.credit===num);

  const delEditingAccount = (num) => { setConfirmDel(num); };

  const confirmDelAccount = () => {
    setAccounts(p=>p.filter(a=>a.number!==confirmDel));
    setEditing(null);
    setConfirmDel(null);
  };

  const catCfg = {
    aktiven: {label:"AKTIVEN",   color:"#1D4ED8", bg:"#EFF6FF", border:"#BFDBFE"},
    passiven:{label:"PASSIVEN",  color:"#15803D", bg:"#F0FDF4", border:"#BBF7D0"},
    ertrag:  {label:"ERTRÄGE",   color:"#059669", bg:"#ECFDF5", border:"#A7F3D0"},
    aufwand: {label:"AUFWÄNDE",  color:"#DC2626", bg:"#FEF2F2", border:"#FECACA"},
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{fontSize:13,color:"#64748B"}}>
          {accounts.length} Konten · Kontenrahmen {year}
          <span style={{fontSize:11.5,marginLeft:10,color:MUTED}}>Vorlage wechseln, Import/Export: ⚙️ Einstellungen</span>
        </span>
        <button onClick={()=>setOpen(s=>!s)} style={PB}>{open?"Abbrechen":"+ Neues Konto"}</button>
      </div>

      {open && (
        <Card title="Neues Konto anlegen">
          <div style={{display:"grid",gridTemplateColumns:"110px 1fr 150px 1fr 100px auto",gap:10,alignItems:"end"}}>
            <Field label="Konto-Nr. *">
              <input type="text" value={form.number} onChange={e=>f("number",e.target.value)}
                placeholder="z.B. 3600" style={IS}/>
            </Field>
            <Field label="Bezeichnung *">
              <input type="text" value={form.name} onChange={e=>f("name",e.target.value)}
                placeholder="Kontoname" style={IS}/>
            </Field>
            <Field label="Kategorie *">
              <select value={form.category} onChange={e=>f("category",e.target.value)} style={IS}>
                <option value="aktiven">Aktiven</option>
                <option value="passiven">Passiven</option>
                <option value="ertrag">Ertrag</option>
                <option value="aufwand">Aufwand</option>
              </select>
            </Field>
            <Field label="Gruppe">
              <input type="text" value={form.group} onChange={e=>f("group",e.target.value)}
                placeholder="z.B. Vereinserträge" style={IS}/>
            </Field>
            <Field label="Währung">
              <input type="text" list="fx-currencies" maxLength={3}
                value={fxAllowed(form.category)?form.currency:CHF}
                disabled={!fxAllowed(form.category)}
                onChange={e=>f("currency",e.target.value.toUpperCase())}
                style={{...IS,fontFamily:"'JetBrains Mono',monospace",
                        background:fxAllowed(form.category)?"white":"#F1F5F9"}}/>
            </Field>
            <button onClick={addAccount} style={{...PB,height:38}}>Anlegen</button>
          </div>
          <datalist id="fx-currencies">
            {[CHF,...COMMON_CURRENCIES].map(c=><option key={c} value={c}/>)}
          </datalist>
          {fxAllowed(form.category) && cleanCur(form.currency)!==CHF && (
            <div style={{marginTop:8,fontSize:12,color:"#9A3412"}}>
              Fremdwährungskonto: Buchungen werden mit Betrag in {cleanCur(form.currency)} und Kurs erfasst und
              in CHF verbucht. Per 31.12. Bewertung zum Stichtagskurs im Tab «Fremdwährung».
            </div>
          )}
          {error && <div style={{color:"#DC2626",marginTop:8,fontSize:12}}>⚠ {error}</div>}
        </Card>
      )}

      {editErr && (
        <div style={{color:"#DC2626",marginBottom:10,fontSize:12,padding:"6px 10px",
                     background:"#FEF2F2",borderRadius:5}}>⚠ {editErr}</div>
      )}

      {["aktiven","passiven","ertrag","aufwand"].map(cat => {
        const accs = accounts.filter(a=>a.category===cat).sort((a,b)=>a.number.localeCompare(b.number));
        if(!accs.length) return null;
        const cfg = catCfg[cat];
        const total = accs.reduce((s,a)=>s+getSaldo(a.number,year),0);
        return (
          <div key={cat} style={{marginBottom:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontWeight:800,fontSize:11,color:cfg.color,letterSpacing:1.5}}>
                {cfg.label}
              </span>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,
                            fontWeight:600,color:cfg.color}}>
                Total: CHF {fmt(total)}
              </span>
            </div>
            <div style={{background:"white",borderRadius:8,border:"1px solid #E2E8F0",overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr>
                    <Th style={{width:80}}>Kto-Nr.</Th>
                    <Th>Bezeichnung</Th>
                    <Th style={{width:200}}>Gruppe</Th>
                    <Th align="right" style={{width:140}}>Saldo {year}</Th>
                    <Th className="no-print" style={{width:90}}/>
                  </tr>
                </thead>
                <tbody>
                  {accs.map(a => {
                    const saldo = getSaldo(a.number,year);
                    const isEditing = editing?.number === a.number;

                    if(isEditing) return (
                      <tr key={a.number} style={{background:"#FEFCE8",outline:"2px solid #F59E0B",
                                                  outlineOffset:"-2px"}}>
                        <Td style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                                    color:cfg.color,fontSize:12}}>{a.number}</Td>
                        <Td>
                          <input
                            autoFocus
                            type="text"
                            value={editing.name}
                            onChange={e=>setEditing(p=>({...p,name:e.target.value}))}
                            onKeyDown={e=>{ if(e.key==="Enter") saveEdit(); if(e.key==="Escape") cancelEdit(); }}
                            style={{...IS,padding:"5px 8px",fontSize:13,fontWeight:500,
                                    borderColor:"#F59E0B",boxShadow:"0 0 0 3px rgba(245,158,11,.15)"}}
                          />
                          {fxAllowed(a.category) && (
                            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4,fontSize:11,color:"#64748B"}}>
                              Währung
                              <input type="text" list="fx-currencies-edit" maxLength={3}
                                value={editing.currency}
                                disabled={hasBookings(a.number)}
                                title={hasBookings(a.number)?"Konto hat Buchungen – Währung nicht änderbar":""}
                                onChange={e=>setEditing(p=>({...p,currency:e.target.value.toUpperCase()}))}
                                onKeyDown={e=>{ if(e.key==="Enter") saveEdit(); if(e.key==="Escape") cancelEdit(); }}
                                style={{...IS,width:70,padding:"3px 6px",fontSize:12,
                                        fontFamily:"'JetBrains Mono',monospace",borderColor:"#F59E0B"}}/>
                              <datalist id="fx-currencies-edit">
                                {[CHF,...COMMON_CURRENCIES].map(c=><option key={c} value={c}/>)}
                              </datalist>
                            </div>
                          )}
                        </Td>
                        <Td>
                          <input
                            type="text"
                            value={editing.group}
                            onChange={e=>setEditing(p=>({...p,group:e.target.value}))}
                            onKeyDown={e=>{ if(e.key==="Enter") saveEdit(); if(e.key==="Escape") cancelEdit(); }}
                            placeholder="Gruppe…"
                            style={{...IS,padding:"5px 8px",fontSize:13,
                                    borderColor:"#F59E0B",boxShadow:"0 0 0 3px rgba(245,158,11,.15)"}}
                          />
                        </Td>
                        <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace",
                                                   color:"#CBD5E1",fontSize:13}}>
                          {saldo!==0?fmt(saldo):"—"}
                        </Td>
                        <Td className="no-print" align="right">
                          <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}>
                            <button onClick={saveEdit}
                              style={{...PB,padding:"4px 10px",fontSize:12,background:"#16A34A"}}
                              title="Speichern (Enter)">✓</button>
                            <button onClick={cancelEdit}
                              style={{...SB,padding:"4px 10px",fontSize:12}}
                              title="Abbrechen (Esc)">✕</button>
                            {!hasBookings(a.number) && confirmDel!==a.number && (
                              <button onClick={()=>delEditingAccount(a.number)}
                                style={{...SB,padding:"4px 10px",fontSize:12,
                                        borderColor:"#FECACA",color:"#EF4444"}}
                                title="Konto löschen (keine Buchungen vorhanden)">🗑</button>
                            )}
                            {!hasBookings(a.number) && confirmDel===a.number && (
                              <>
                                <span style={{fontSize:11,color:"#DC2626",whiteSpace:"nowrap",
                                              alignSelf:"center",fontWeight:600}}>Sicher?</span>
                                <button onClick={confirmDelAccount}
                                  style={{...PB,padding:"4px 10px",fontSize:12,background:"#DC2626"}}>
                                  Ja, löschen
                                </button>
                                <button onClick={()=>setConfirmDel(null)}
                                  style={{...SB,padding:"4px 10px",fontSize:12}}>
                                  Nein
                                </button>
                              </>
                            )}
                          </div>
                        </Td>
                      </tr>
                    );

                    return (
                      <tr key={a.number} className="hover-row">
                        <Td style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                                    color:cfg.color,fontSize:12}}>{a.number}</Td>
                        <Td>{a.name}<CurBadge cur={a.currency}/></Td>
                        <Td style={{color:MUTED,fontSize:12}}>{a.group||"—"}</Td>
                        <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace",
                                                  fontWeight:saldo!==0?600:400,
                                                  color:saldo<0?"#DC2626":saldo>0?"#0F172A":"#CBD5E1"}}>
                          {saldo!==0?fmt(saldo):"—"}
                          {a.currency&&a.currency!==CHF&&(
                            <div style={{fontSize:10.5,fontWeight:500,color:"#C2410C"}}>
                              {a.currency} {fmt(getFxSaldo(a.number,year))}
                            </div>
                          )}
                        </Td>
                        <Td className="no-print" align="right">
                          <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}>
                            <button onClick={()=>startEdit(a)}
                              style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",
                                      fontSize:14,padding:"2px 5px",transition:"color .15s",lineHeight:1}}
                              onMouseEnter={e=>e.currentTarget.style.color="#F59E0B"}
                              onMouseLeave={e=>e.currentTarget.style.color="#CBD5E1"}
                              title="Umbenennen">✏</button>
                            <button onClick={()=>delAccount(a.number)}
                              style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",
                                      fontSize:15,padding:"2px 5px",transition:"color .15s",lineHeight:1}}
                              onMouseEnter={e=>e.currentTarget.style.color="#EF4444"}
                              onMouseLeave={e=>e.currentTarget.style.color="#CBD5E1"}
                              title="Löschen">×</button>
                          </div>
                        </Td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}
    </div>
  );
}

const HB_CAT_COLOR = {aktiven:"#1D4ED8",passiven:"#15803D",ertrag:"#059669",aufwand:"#DC2626"};

// Kontoblatt mit laufendem Saldo (CHF und ggf. Fremdwährung)
const buildLedger = (acc, entries) => {
  const num = acc.number;
  const cur = acc.currency||CHF;
  const isDbNormal = acc.category==="aktiven"||acc.category==="aufwand";
  const ents = entries.filter(e=>e.debit===num||e.credit===num)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  let run=0, fxRun=0;
  const rows = ents.map(e=>{
    const soll  = e.debit===num  ? Number(e.amount) : null;
    const haben = e.credit===num ? Number(e.amount) : null;
    const sign  = isDbNormal ? (soll!==null?1:-1) : (haben!==null?1:-1);
    run += sign*Number(e.amount);
    const fx = cur!==CHF && e.fxCurrency===cur ? sign*Number(e.fxAmount||0) : 0;
    fxRun += fx;
    const counter = e.debit===num ? e.credit : e.debit;
    return {...e,soll,haben,saldo:round2(run),fx,fxSaldo:round2(fxRun),counter};
  });
  return {
    account: acc, rows,
    totSoll:  rows.reduce((s,r)=>s+(r.soll||0),0),
    totHaben: rows.reduce((s,r)=>s+(r.haben||0),0),
    saldo:    rows.length ? rows[rows.length-1].saldo   : 0,
    fxSaldo:  rows.length ? rows[rows.length-1].fxSaldo : 0,
  };
};

function HauptbuchTab({ accounts, entries, setEntries, year }) {
  const [selAcc, setSelAcc] = useState("");
  const [filterY, setFilterY] = useState(true);
  const [editing, setEditing] = useState(null); // Buchung + ledgerAcc (Konto, in dessen Blatt bearbeitet wird)
  const [editErr, setEditErr] = useState("");

  const cancelEdit = () => { setEditing(null); setEditErr(""); };
  const edit = {
    value: editing, err: editErr, cancel: cancelEdit,
    start: (r, ledgerAcc) => {
      const e = entries.find(x=>x.id===r.id);
      if(!e) return;
      setEditErr("");
      setEditing({ ...e, ledgerAcc, amount:String(e.amount),
        fxAmount: e.fxAmount ? String(e.fxAmount) : "", fxRate: e.fxRate ? String(e.fxRate) : "",
        fxReval: !!e.fxReval });
    },
    set: (k,v) => setEditing(p=>fxFormUpdate(p,k,v)),
    swap: () => setEditing(swapAccounts),
    save: () => {
      const { entry, error } = normalizeEntry(editing, accounts);
      if(error){ setEditErr(error); return; }
      setEntries(p=>p.map(e=>e.id===editing.id?entry:e));
      cancelEdit();
    },
    del: () => { setEntries(p=>p.filter(e=>e.id!==editing.id)); cancelEdit(); },
  };

  const account = accounts.find(a=>a.number===selAcc);
  const isDebitNormal = account&&(account.category==="aktiven"||account.category==="aufwand");
  const catColor = HB_CAT_COLOR;

  const yearEntries = useMemo(()=>
    filterY ? entries.filter(e=>e.date.startsWith(String(year))) : entries
  ,[entries,filterY,year]);

  const ledger = useMemo(()=> account ? buildLedger(account, yearEntries) : null, [account,yearEntries]);
  const saldo  = ledger ? ledger.saldo : 0;
  const isFx   = account && (account.currency||CHF)!==CHF;

  // Alle Konten mit Buchungen (wenn kein Konto ausgewählt)
  const allAccountRows = useMemo(()=>{
    if(selAcc) return [];
    return accounts
      .slice()
      .sort((a,b)=>a.number.localeCompare(b.number))
      .map(acc=>buildLedger(acc, yearEntries))
      .filter(g=>g.rows.length>0);
  },[accounts,yearEntries,selAcc]);

  return (
    <div>
      <Card title="Konto auswählen">
        <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:12,alignItems:"end"}}>
          <Field label="Konto">
            <AccountSelect accounts={accounts} value={selAcc} onChange={setSelAcc}/>
          </Field>
          <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:"#555",
                         cursor:"pointer",height:38,whiteSpace:"nowrap"}}>
            <input type="checkbox" checked={filterY} onChange={e=>setFilterY(e.target.checked)}/>
            Nur {year}
          </label>
        </div>

        {account && (
          <div style={{display:"flex",gap:20,flexWrap:"wrap",marginTop:12,padding:"10px 12px",
                       background:"#F8FAFC",borderRadius:6,borderLeft:`3px solid ${catColor[account.category]||"#ccc"}`}}>
            <div>
              <div style={{fontSize:10,color:MUTED,marginBottom:1}}>Konto</div>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                            color:catColor[account.category]}}>{account.number}</span>
            </div>
            <div>
              <div style={{fontSize:10,color:MUTED,marginBottom:1}}>Bezeichnung</div>
              <span style={{fontWeight:600}}>{account.name}</span><CurBadge cur={account.currency}/>
            </div>
            <div>
              <div style={{fontSize:10,color:MUTED,marginBottom:1}}>Kategorie</div>
              <Badge cat={account.category}/>
            </div>
            <div>
              <div style={{fontSize:10,color:MUTED,marginBottom:1}}>Normalsaldo</div>
              <span style={{fontSize:12,color:"#64748B"}}>
                {isDebitNormal?"Soll (Debit)":"Haben (Kredit)"}
              </span>
            </div>
            <div style={{marginLeft:"auto",textAlign:"right"}}>
              <div style={{fontSize:10,color:MUTED,marginBottom:1}}>Aktueller Saldo</div>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:17,
                            color:saldo>=0?"#0F172A":"#DC2626"}}>
                CHF {fmt(saldo)}
              </span>
              {isFx&&(
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600,fontSize:13,color:"#C2410C"}}>
                  {account.currency} {fmt(ledger.fxSaldo)}

              )}
            </div>
          </div>
        )}
      </Card>

      {selAcc ? (
        <div style={{background:"white",borderRadius:10,border:"1px solid #E2E8F0",
                     overflow:"auto",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
          {ledger && <LedgerTable ledger={ledger} accounts={accounts} edit={edit}/>}

      ) : (
        <div>
          {allAccountRows.length===0 ? (
            <div style={{padding:32,textAlign:"center",color:MUTED,fontStyle:"italic"}}>

          ) : allAccountRows.map(g=>(
            <div key={g.account.number} style={{marginBottom:20}}>

                           background:"#F8FAFC",borderRadius:"8px 8px 0 0",

                           borderBottom:"1px solid #E2E8F0"}}>

                              color:catColor[g.account.category]||"#333"}}>{g.account.number}</span>
                <span style={{fontWeight:600,fontSize:14}}>{g.account.name}</span>
                <CurBadge cur={g.account.currency}/>

                              color:g.saldo>=0?"#0F172A":"#DC2626"}}>
                  {(g.account.currency||CHF)!==CHF&&(
                    <span style={{color:"#C2410C",marginRight:14,fontWeight:600}}>
                      {g.account.currency} {fmt(g.fxSaldo)}

                  CHF {fmt(g.saldo)}

              </div>
              <div style={{background:"white",borderRadius:"0 0 10px 10px",border:"1px solid #E2E8F0",
                           borderTop:"none",overflow:"auto",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
                <LedgerTable ledger={g} accounts={accounts} edit={edit}/>

            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function BilanzTab({ accounts, getSaldo, getFxSaldo, fxRates, year, settings }) {
  const fxRows = computeFxValuation({ accounts, getSaldo, getFxSaldo, rates:fxRates?.[year], year })
    .filter(r=>r.fxSaldo!==0||r.book!==0);
  const fxMissingRate = fxRows.filter(r=>!r.rate);
  const fxOpenLoss    = fxRows.filter(r=>r.diff && !r.isGain);
  const aktiven  = accounts.filter(a=>a.category==="aktiven").sort((a,b)=>a.number.localeCompare(b.number));
  const passiven = accounts.filter(a=>a.category==="passiven").sort((a,b)=>a.number.localeCompare(b.number));
  const ertraege = accounts.filter(a=>a.category==="ertrag").reduce((s,a)=>s+getSaldo(a.number,year),0);
  const aufwaende= accounts.filter(a=>a.category==="aufwand").reduce((s,a)=>s+getSaldo(a.number,year),0);
  const jahrRes  = ertraege - aufwaende;
  const resultNr = settings?.resultAccount || DEFAULT_RESULT_ACCOUNT;   // Konto-Nr. gemäss Kontenplan

  const totalAkt = aktiven.reduce((s,a)=>s+getSaldo(a.number,year),0);
  const totalPas = passiven.reduce((s,a)=>s+getSaldo(a.number,year),0)+jahrRes;
  const diff = Math.abs(totalAkt-totalPas);
  const balanced = diff < 0.01;

  const aktGroups = [...new Set(aktiven.map(a=>a.group))];
  const pasGroups = [...new Set(passiven.map(a=>a.group))];

  const SideSection = ({ accs, group, color }) => {
    const ga = accs.filter(a=>a.group===group);
    const gt = ga.reduce((s,a)=>s+getSaldo(a.number,year),0);
    return (
      <>
        <tr>
          <td colSpan={3} style={{padding:"8px 12px 3px",fontWeight:700,fontSize:10.5,
                                   color:"#64748B",textTransform:"uppercase",letterSpacing:.5}}>
            {group}

        {ga.map(a=>{
          const s=getSaldo(a.number,year);
          return (
            <tr key={a.number} className="hover-row">
              <td style={{padding:"4px 12px 4px 22px",fontSize:11.5,
                          fontFamily:"'JetBrains Mono',monospace",color:MUTED}}>{a.number}</td>

                          fontSize:13,fontWeight:s!==0?500:400,color:s!==0?"#0F172A":"#CBD5E1"}}>
                {s!==0?fmt(s):"—"}
                {a.currency&&a.currency!==CHF&&getFxSaldo(a.number,year)!==0&&(
                  <div style={{fontSize:10.5,fontWeight:400,color:"#C2410C"}}>
                    {a.currency} {fmt(getFxSaldo(a.number,year))}
                  </div>
                )}
              </td>
            </tr>
          );
        })}
        <tr style={{borderBottom:"1px solid #E2E8F0"}}>
          <td colSpan={2} style={{padding:"3px 12px 7px 22px",fontSize:11.5,color:MUTED,fontStyle:"italic"}}>
            Subtotal {group}
          </td>
          <td style={{padding:"3px 12px 7px",textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                      fontSize:13,fontWeight:600,color}}>{fmt(gt)}</td>
        </tr>
